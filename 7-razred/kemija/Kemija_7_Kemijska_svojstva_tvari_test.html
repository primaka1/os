<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kemijska svojstva tvari – 7. razred</title><style>
:root{--blue:#135b78;--green:#18794e;--red:#b42318;--gold:#b77900;--bg:#edf4f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Verdana,sans-serif;color:#172533;line-height:1.55}main{max-width:900px;margin:auto;padding:10px}header{background:linear-gradient(135deg,#135b78,#2384a1);color:#fff;padding:24px;border-radius:18px}h1{margin:0;font-size:clamp(1.8rem,7vw,2.8rem)}.intro,.card,#summary{background:#fff;border-radius:15px;padding:17px;margin:13px 0;box-shadow:0 2px 9px #0001}.card{border:3px solid transparent}.card.correct{border-color:var(--green)}.card.wrong{border-color:var(--red)}.section{display:inline-block;background:#dff2f7;color:#0d4d64;border-radius:20px;padding:4px 10px;font-size:.82rem;font-weight:bold}.question{font-size:1.08rem;font-weight:bold;margin:10px 0}.options{display:grid;gap:8px}.option{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid #cad7dc;border-radius:9px;background:#fff;cursor:pointer}.option:hover{background:#eff7fa}.option input{margin-top:4px;transform:scale(1.2)}select,input[type=text]{width:100%;padding:12px;border:2px solid #aabac1;border-radius:9px;font-size:17px;background:#fff}.fillrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feedback{display:none;padding:12px;margin-top:11px;border-radius:9px}.feedback.show{display:block}.feedback.good{background:#e8f7ef;border-left:6px solid var(--green)}.feedback.bad{background:#fff0ef;border-left:6px solid var(--red)}button{border:0;border-radius:10px;padding:13px 18px;min-height:50px;background:var(--blue);color:#fff;font-size:17px;font-weight:bold;cursor:pointer}.secondary{background:#64748b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}#summary{display:none;border:3px solid var(--blue);position:sticky;top:5px;z-index:5;font-size:1.05rem}.legend{display:flex;gap:12px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:20px;font-weight:bold}.physical{background:#e8efff;color:#244c93}.chemical{background:#fff0d3;color:#7b5000}@media(max-width:600px){main{padding:7px}.card{padding:14px}.fillrow{grid-template-columns:1fr}.option{padding:12px}.actions button{width:100%}}</style></head><body><main>
<header><h1>Kemijska svojstva tvari</h1><div>Kemija · 7. razred</div></header>
<div class="intro"><p><b>Uputa:</b> Riješi pitanja, a zatim pritisni <b>Provjeri i predaj test</b>. Ispod svakog pitanja dobit ćeš točan odgovor i objašnjenje.</p><div class="legend"><span class="chip physical">Fizikalno svojstvo</span><span class="chip chemical">Kemijsko svojstvo</span></div></div>
<div id="summary"></div><form id="quiz"></form><div class="actions"><button type="button" id="submit">Provjeri i predaj test</button><button type="button" id="reset" class="secondary" style="display:none">Riješi ponovno</button></div>
</main><script>
const questions=[
{section:'Dopuni rečenicu',q:'Svojstva tvari dijele se na ________ i ________ svojstva.',type:'two',answers:['fizikalna','kemijska'],ex:'Fizikalna svojstva opažamo ili mjerimo bez nastanka nove tvari, dok kemijska svojstva opisuju kako se tvar može kemijski promijeniti.'},
{section:'Dopuni rečenicu',q:'Svojstva tvari ovise o njihovoj građi i ________ sastavu.',type:'text',answer:'kemijskom',ex:'Svojstva ovise o građi čestica i kemijskom sastavu tvari.'},
{section:'Odaberi sve točne odgovore',q:'Koja su od navedenih svojstava kemijska svojstva tvari?',type:'multi',opts:['tvrdoća','agregacijsko stanje','reaktivnost','električna vodljivost','sposobnost gorenja','inertnost'],correct:[2,4,5],ex:'Reaktivnost, sposobnost gorenja i inertnost opisuju sudjelovanje tvari u kemijskim promjenama. Tvrdoća, agregacijsko stanje i električna vodljivost fizikalna su svojstva.'},
{section:'Razvrstavanje svojstava',q:'Tvrdoća je:',type:'single',opts:['fizikalno svojstvo','kemijsko svojstvo'],correct:0,ex:'Tvrdoća se može ispitati bez promjene kemijskog sastava tvari, zato je fizikalno svojstvo.'},
{section:'Razvrstavanje svojstava',q:'Električna vodljivost je:',type:'single',opts:['kemijsko svojstvo','fizikalno svojstvo'],correct:1,ex:'Električnu vodljivost možemo mjeriti bez stvaranja nove tvari, pa je fizikalno svojstvo.'},
{section:'Razvrstavanje svojstava',q:'Sposobnost gorenja je:',type:'single',opts:['fizikalno svojstvo','kemijsko svojstvo'],correct:1,ex:'Pri gorenju nastaju nove tvari, zato je sposobnost gorenja kemijsko svojstvo.'},
{section:'Točno ili netočno',q:'Aluminij je metal sive boje i male gustoće.',type:'tf',correct:true,ex:'Tvrdnja je točna. Boja i gustoća fizikalna su svojstva aluminija.'},
{section:'Točno ili netočno',q:'Željezo na vlažnom zraku ne hrđa.',type:'tf',correct:false,ex:'Tvrdnja je netočna. Željezo na vlažnom zraku reagira s kisikom i vodom te nastaje hrđa.'},
{section:'Točno ili netočno',q:'Agregacijsko stanje je kemijsko svojstvo tvari.',type:'tf',correct:false,ex:'Agregacijsko stanje je fizikalno svojstvo jer se promjenom agregacijskog stanja ne mijenja kemijski sastav tvari.'},
{section:'Točno ili netočno',q:'Gustoća je omjer mase i volumena tvari.',type:'tf',correct:true,ex:'Tvrdnja je točna. Gustoću računamo kao masu podijeljenu volumenom: ρ = m/V.'},
{section:'Točno ili netočno',q:'Magnezij je metal koji može gorjeti.',type:'tf',correct:true,ex:'Tvrdnja je točna. Magnezij može gorjeti vrlo sjajnim bijelim plamenom, što pokazuje njegovo kemijsko svojstvo.'},
{section:'Poveži tvar i svojstvo',q:'Koje svojstvo najbolje opisuje kuhinjsku sol?',type:'single',opts:['kemijski inertna tvar koja se koristi za nakit','umjetna tvar koja se teško razgrađuje','tvar bijele boje topljiva u vodi'],correct:2,ex:'Kuhinjska sol jest bijela čvrsta tvar koja se otapa u vodi.'},
{section:'Poveži tvar i svojstvo',q:'Koje svojstvo najbolje opisuje plastiku?',type:'single',opts:['umjetna tvar koja se teško razgrađuje','tvar bijele boje topljiva u vodi','kemijski inertna tvar koja se koristi za nakit'],correct:0,ex:'Mnoge vrste plastike umjetne su tvari koje se vrlo sporo razgrađuju u okolišu.'},
{section:'Poveži tvar i svojstvo',q:'Koje svojstvo najbolje opisuje zlato?',type:'single',opts:['tvar bijele boje topljiva u vodi','kemijski inertna tvar koja se koristi za izradu nakita','umjetna tvar koja se teško razgrađuje'],correct:1,ex:'Zlato je slabo reaktivno, odnosno kemijski prilično inertno, pa je pogodno za izradu nakita.'},
{section:'Primjena znanja',q:'Koje svojstvo opisujemo kada kažemo da tvar ne reagira lako s drugim tvarima?',type:'single',opts:['inertnost','tvrdoća','gustoća'],correct:0,ex:'Inertnost znači slabu sklonost tvari kemijskim reakcijama.'},
{section:'Primjena znanja',q:'Koja promjena pokazuje kemijsko svojstvo željeza?',type:'single',opts:['željezo je čvrsto','željezo provodi električnu struju','željezo hrđa na vlažnom zraku'],correct:2,ex:'Hrđanjem nastaje nova tvar, pa hrđanje pokazuje kemijsko svojstvo željeza.'},
{section:'Primjena znanja',q:'Koje od navedenog možemo opažati bez nastanka nove tvari?',type:'single',opts:['gorenje magnezija','hrđanje željeza','boju aluminija'],correct:2,ex:'Promatranjem boje aluminija ne nastaje nova tvar. Gorenje i hrđanje kemijske su promjene.'},
{section:'Primjena znanja',q:'Koja je razlika između fizikalnoga i kemijskoga svojstva?',type:'single',opts:['fizikalno svojstvo uvijek opisuje samo metale','kemijsko svojstvo opisuje kako tvar sudjeluje u kemijskoj promjeni','fizikalno svojstvo uvijek uključuje nastanak nove tvari'],correct:1,ex:'Kemijsko svojstvo opisuje sposobnost tvari da kemijskom reakcijom prijeđe u novu tvar. Fizikalno svojstvo opažamo ili mjerimo bez promjene kemijskog sastava.'}
];
const quiz=document.getElementById('quiz');
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g,' ')}
function render(){quiz.innerHTML='';questions.forEach((x,i)=>{let body='';if(x.type==='two')body=`<div class="fillrow"><input id="a${i}_0" type="text" placeholder="Prvo svojstvo"><input id="a${i}_1" type="text" placeholder="Drugo svojstvo"></div>`;else if(x.type==='text')body=`<input id="a${i}" type="text" placeholder="Upiši riječ">`;else if(x.type==='multi')body=`<div class="options">${x.opts.map((o,j)=>`<label class="option"><input type="checkbox" name="a${i}" value="${j}"><span>${o}</span></label>`).join('')}</div>`;else if(x.type==='tf')body=`<div class="options"><label class="option"><input type="radio" name="a${i}" value="true">TOČNO</label><label class="option"><input type="radio" name="a${i}" value="false">NETOČNO</label></div>`;else body=`<div class="options">${x.opts.map((o,j)=>`<label class="option"><input type="radio" name="a${i}" value="${j}"><span>${o}</span></label>`).join('')}</div>`;quiz.innerHTML+=`<article class="card" id="c${i}"><span class="section">${x.section}</span><div class="question">${i+1}. ${x.q}</div>${body}<div class="feedback" id="f${i}"></div></article>`})}
function evaluate(x,i){if(x.type==='two'){let a=[norm(document.getElementById(`a${i}_0`).value),norm(document.getElementById(`a${i}_1`).value)];return x.answers.every(v=>a.includes(v))}if(x.type==='text')return norm(document.getElementById(`a${i}`).value)===x.answer;if(x.type==='multi'){let a=[...document.querySelectorAll(`input[name=a${i}]:checked`)].map(z=>+z.value).sort();return JSON.stringify(a)===JSON.stringify(x.correct)}let a=document.querySelector(`input[name=a${i}]:checked`);if(!a)return false;return x.type==='tf'?(a.value==='true')===x.correct:+a.value===x.correct}
function correctText(x){if(x.type==='two')return x.answers.join(' i ');if(x.type==='text')return x.answer;if(x.type==='multi')return x.correct.map(j=>x.opts[j]).join(', ');if(x.type==='tf')return x.correct?'TOČNO':'NETOČNO';return x.opts[x.correct]}
document.getElementById('submit').onclick=()=>{let score=0;questions.forEach((x,i)=>{let ok=evaluate(x,i),c=document.getElementById('c'+i),f=document.getElementById('f'+i);if(ok)score++;c.className='card '+(ok?'correct':'wrong');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<b>${ok?'✓ Točno!':'✗ Netočno.'}</b><br><b>Točan odgovor:</b> ${correctText(x)}<br><b>Objašnjenje:</b> ${x.ex}`;c.querySelectorAll('input').forEach(e=>e.disabled=true)});let p=Math.round(score/questions.length*100),g=p>=90?'Odličan (5)':p>=75?'Vrlo dobar (4)':p>=60?'Dobar (3)':p>=50?'Dovoljan (2)':'Nedovoljan (1)';let s=document.getElementById('summary');s.style.display='block';s.innerHTML=`<b>Rezultat: ${score}/${questions.length} (${p}%)</b><br>Ocjena: <b>${g}</b><br><small>Ispod svakog pitanja prikazani su točan odgovor i objašnjenje.</small>`;document.getElementById('submit').style.display='none';document.getElementById('reset').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})};document.getElementById('reset').onclick=()=>{render();document.getElementById('summary').style.display='none';document.getElementById('submit').style.display='inline-block';document.getElementById('reset').style.display='none';scrollTo(0,0)};render();
</script></body></html>
