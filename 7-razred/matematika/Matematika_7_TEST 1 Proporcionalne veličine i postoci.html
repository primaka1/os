<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proporcionalne veličine i postoci</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:Arial,sans-serif;color:#172033;line-height:1.45}main{max-width:820px;margin:auto;padding:10px}header{background:#28639d;color:#fff;padding:22px;border-radius:18px}h1{font-size:clamp(1.7rem,7vw,2.8rem);margin:0 0 10px}.help,.card,#sum{background:#fff;padding:16px;margin:13px 0;border-radius:15px}.card{border:2px solid transparent;box-shadow:0 2px 8px #0001}.card.ok{border-color:#18794e}.card.bad{border-color:#b42318}.title{font-weight:700;font-size:1.1rem;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:9px}.answerRow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:9px}.simpleRow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}input{width:100%;min-width:0;padding:13px;font-size:18px;border:2px solid #aab7c7;border-radius:9px}input:disabled{background:#edf0f3}button{min-height:48px;border:0;border-radius:9px;padding:11px 15px;background:#28639d;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.green{background:#18794e}.purple{background:#783fa0}.gray{background:#64748b}.calcBtn{background:#783fa0;white-space:nowrap}.fb{display:none;padding:11px;margin-top:11px;border-radius:9px}.fb.show{display:block}.fb.good{background:#e9f8ef;border-left:5px solid #18794e}.fb.wrong{background:#fff0ef;border-left:5px solid #b42318}#sum{display:none;border:3px solid #28639d;position:sticky;top:5px;z-index:3}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.calc{width:min(390px,100%);background:#fff;border-radius:17px;padding:15px;box-shadow:0 18px 60px #0008}.calcTop{display:flex;justify-content:space-between;align-items:center}.calcTop h2{margin:0}.display{text-align:right;font-size:27px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.keys button{font-size:21px;background:#e6eef7;color:#173f70}.keys .equal{background:#18794e;color:#fff}.keys .danger{background:#fff0ef;color:#9b2018}.calcResult{text-align:right;font-weight:bold;font-size:21px;min-height:32px;margin-top:8px}.useBtn{width:100%;margin-top:8px;background:#783fa0}.small{font-size:.9rem;color:#536579}
@media(max-width:560px){main{padding:7px}.card{padding:13px}.row{grid-template-columns:1fr}.row button{width:100%}.answerRow{grid-template-columns:auto 1fr}.answerRow button{grid-column:1/-1;width:100%}.simpleRow{grid-template-columns:1fr auto}.simpleRow .checkSimple{grid-column:1/-1;width:100%}.calcBtn{padding:10px 13px}}
</style></head>
<body><main><header><h1>Proporcionalne veličine i postoci</h1><div>7. razred · 30 nasumičnih zadataka</div></header>
<div class="help"><b>Uputa:</b> Kod jednostavnih pretvorbi upisuje se samo odgovor. Kod računskih i tekstualnih zadataka najprije se provjerava postavljeni račun, a zatim rješenje. Svako pitanje ima svoj gumb <b>CALC</b>.</div>
<div id="sum"></div><section id="quiz"></section><div class="actions"><button id="finish">Predaj test</button><button id="fresh" class="gray">Novi test</button></div></main>
<div id="modal" class="modal"><div class="calc"><div class="calcTop"><h2>Kalkulator</h2><button id="closeCalc" class="gray" type="button">Zatvori</button></div><input id="calcDisplay" class="display" type="text" inputmode="text" placeholder="0"><div id="keys" class="keys"></div><div id="calcResult" class="calcResult"></div><button id="useResult" class="useBtn" type="button">Prenesi rezultat u odgovor</button></div></div>
<script>
const N=30,$=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];let T=[],activeAnswer=null;
function make(){let k=rnd(0,7),q,v,f,e,u='',simple=false;
 if(k===0){let p=pick([2,5,8,10,13,25,34,46,50,75]);q=`Postotak ${p}% zapiši kao decimalni broj.`;v=p/100;f=`${p}/100`;e='Postotak pretvaramo u decimalni broj dijeljenjem sa 100.';simple=true}
 else if(k===1){let d=pick([2,4,5,10,20,25,50,100]),n=rnd(1,d);q=`Razlomak ${n}/${d} zapiši kao postotak.`;v=n/d*100;f=`${n}/${d}*100`;e='Razlomak pretvaramo u decimalni broj i množimo sa 100.';u='%';simple=true}
 else if(k===2){let p=pick([5,10,20,25,35,50,75]),n=pick([40,48,80,120,200,240,420]);q=`Izračunaj ${p}% od ${n}.`;v=p/100*n;f=`${p}/100*${n}`;e='Postotak podijelimo sa 100 i množimo zadanim brojem.'}
 else if(k===3){let a=rnd(2,8),d=rnd(2,9),b=rnd(2,10);q=`${a} radnika obavi posao za ${d} dana. Za koliko bi dana posao obavilo ${b} radnika?`;v=a*d/b;f=`${a}*${d}/${b}`;e='Broj radnika i broj dana obrnuto su proporcionalni.';u='dana'}
 else if(k===4){let kg=pick([2,3,4,5]),p=pick([8,12,15,20]),n=pick([1,3,6,8]);q=`${kg} kg voća stoji ${p} €. Koliko stoji ${n} kg?`;v=p/kg*n;f=`${p}/${kg}*${n}`;e='Cijena i količina izravno su proporcionalne.';u='€'}
 else if(k===5){let h=pick([2,3,4]),km=pick([120,180,240]),n=rnd(1,6);q=`Automobil prijeđe ${km} km za ${h} sata. Koliko prijeđe za ${n} sata?`;v=km/h*n;f=`${km}/${h}*${n}`;e='Put i vrijeme pri stalnoj brzini izravno su proporcionalni.';u='km'}
 else {let price=pick([38,60,85,120,240,2850]),p=pick([10,20,25,27,35,45]),up=k===7;q=`Cijena je ${price} €. Proizvod je ${up?'poskupio':'pojeftinio'} ${p}%. Kolika je nova cijena?`;v=price*(up?1+p/100:1-p/100);f=`${price}${up?'+':'-'}${p}/100*${price}`;e=`Postotni iznos ${up?'dodajemo početnoj cijeni':'oduzimamo od početne cijene'}.`;u='€'}
 return{q,v,f,e,u,simple,done:false}}
function ev(s){s=String(s).trim().replace(/,/g,'.').replace(/:/g,'/').replace(/[×·]/g,'*').replace(/−/g,'-').replace(/÷/g,'/');if(!s||!/^[0-9+*/(). -]+$/.test(s))return NaN;try{return Function('"use strict";return('+s+')')()}catch{return NaN}}
function near(a,b){return Number.isFinite(a)&&Math.abs(a-b)<.011}function fmt(x){return Number.isInteger(x)?String(x):x.toFixed(4).replace(/0+$/,'').replace(/\.$/,'').replace('.',',')}
function render(){T=Array.from({length:N},make);$('quiz').innerHTML=T.map((t,i)=>{let body=t.simple?`<div class="simpleRow"><input id="a${i}" type="text" inputmode="text" placeholder="Upiši odgovor"><button type="button" class="calcBtn" onclick="openCalc('a${i}')">CALC</button><button type="button" class="green checkSimple" onclick="checkSimple(${i})">Provjeri odgovor</button></div>`:`<div class="row"><input id="w${i}" type="text" inputmode="text" placeholder="Postavi račun"><button type="button" class="calcBtn" onclick="openCalc('w${i}')">CALC</button><button type="button" onclick="checkWork(${i})">Provjeri račun</button></div><div class="answerRow"><b>=</b><input id="a${i}" type="text" inputmode="text" placeholder="Rješenje" disabled><button type="button" class="calcBtn" onclick="openCalc('a${i}')">CALC</button><button type="button" id="b${i}" class="green" onclick="checkAnswer(${i})" disabled>Provjeri rješenje</button></div>`;return`<article class="card" id="c${i}"><div class="title">${i+1}. ${t.q}</div>${body}<div class="fb" id="f${i}"></div></article>`}).join('');$('sum').style.display='none'}
function good(i){let t=T[i],c=$('c'+i),f=$('f'+i);t.done=true;c.className='card ok';f.className='fb show good';f.innerHTML=`<b>✓ Točno!</b><br><b>Postupak:</b> ${t.f} = ${fmt(t.v)} ${t.u}<br><b>Objašnjenje:</b> ${t.e}`}
function checkSimple(i){let t=T[i],f=$('f'+i),c=$('c'+i);if(near(ev($('a'+i).value),t.v)){good(i);$('a'+i).disabled=true}else{c.className='card bad';f.className='fb show wrong';f.innerHTML=`<b>✗ Odgovor nije točan.</b><br>${t.simple?'Upiši samo traženu vrijednost i pokušaj ponovno.':'Pokušaj ponovno.'}`}}
function checkWork(i){let t=T[i],v=ev($('w'+i).value),f=$('f'+i);if(near(v,t.v)&&/[+*/:\-]/.test($('w'+i).value)){$('w'+i).disabled=true;$('a'+i).disabled=false;$('b'+i).disabled=false;f.className='fb show good';f.innerHTML='<b>✓ Račun je dobro postavljen.</b> Sada upiši rješenje.'}else{f.className='fb show wrong';f.innerHTML='<b>✗ Račun nije dobro postavljen.</b> Pokušaj ponovno.'}}
function checkAnswer(i){let t=T[i],f=$('f'+i),c=$('c'+i);if(near(ev($('a'+i).value),t.v)){good(i);$('a'+i).disabled=true;$('b'+i).disabled=true}else{c.className='card bad';f.className='fb show wrong';f.innerHTML='<b>✗ Rješenje nije točno.</b> Ponovno izračunaj.'}}
function openCalc(target){activeAnswer=$(target);$('calcDisplay').value='';$('calcResult').textContent='';$('modal').classList.add('open')}
$('closeCalc').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
const chars=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','⌫','0',',','='];$('keys').innerHTML=chars.map(x=>`<button type="button" class="${x==='='?'equal':''} ${x==='C'||x==='⌫'?'danger':''}" data-k="${x}">${x}</button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k,d=$('calcDisplay');if(k==='C'){d.value='';$('calcResult').textContent=''}else if(k==='⌫')d.value=d.value.slice(0,-1);else if(k==='='){let v=ev(d.value);$('calcResult').textContent=Number.isFinite(v)?'= '+fmt(v):'Neispravan izraz'}else d.value+=({'×':'*','÷':'/','−':'-'}[k]||k)});
$('useResult').onclick=()=>{let v=ev($('calcDisplay').value);if(!Number.isFinite(v)){$('calcResult').textContent='Najprije izračunaj ispravan izraz';return}if(activeAnswer&&!activeAnswer.disabled){activeAnswer.value=fmt(v);$('modal').classList.remove('open');activeAnswer.focus()}else $('calcResult').textContent='Ovo polje trenutačno nije dostupno.'};
$('finish').onclick=()=>{let s=T.filter(x=>x.done).length,p=Math.round(s/N*100),o=p>=90?'Odličan (5)':p>=75?'Vrlo dobar (4)':p>=60?'Dobar (3)':p>=50?'Dovoljan (2)':'Nedovoljan (1)';$('sum').style.display='block';$('sum').innerHTML=`<b>Rezultat: ${s}/${N} (${p}%)</b><br>Ocjena: <b>${o}</b>`;scrollTo({top:0,behavior:'smooth'})};$('fresh').onclick=()=>{if(confirm('Generirati novih 30 zadataka?'))render()};render();
</script></body></html>
