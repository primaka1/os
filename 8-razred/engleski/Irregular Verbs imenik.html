button{font:inherit;color:inherit;cursor:pointer}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}

.imenik{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 12px;
 }

.groups{display:grid;gap:10px}

.qhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qtext{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.35;margin:0 0 14px}
.qtext .en{font-weight:800;color:var(--accent)}
.opts{display:grid;gap:10px}

.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.inp{font:inherit;font-size:1.4rem;font-weight:700;width:min(260px,100%);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.inp.ok{border-color:var(--good);background:var(--good-bg)} .inp.no{border-color:var(--bad);background:var(--bad-bg)}
.msg{margin-top:10px;font-weight:700;color:var(--bad)}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:1rem;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.fb.ok{background:var(--good-bg);border-left:6px solid var(--good)}
.fb.no{background:var(--bad-bg);border-left:6px solid var(--bad)}
.fb b{display:block}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;width:100%;text-align:left}
.toggle .sw{flex:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{left:25px}

.spk{flex:none;display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--chip);color:var(--accent)}
.spk svg{width:24px;height:24px}
.spk.sm{width:38px;height:38px}.spk.sm svg{width:19px;height:19px}

@keyframes pulse{50%{transform:scale(1.08)}}
.help{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:560px;margin:0 auto;background:var(--card);color:var(--ink);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.help p{margin:6px 0 12px;font-size:.98rem}
.reward{text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
.foot{color:var(--muted);font-size:.85rem;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem;padding:6px}

tell|told|told|reći, ispričati||||Grandpa {told} us a story.|Djed nam je ispričao priču.
think|thought|thought|misliti||tot|tot|I {thought} about you.|Mislio sam na tebe.
throw|threw|thrown|baciti|trou|tru|troun|He {threw} the ball to me.|Bacio mi je loptu.
understand|understood|understood|razumjeti|anderstend|anderstud|anderstud|I {understood} the lesson.|Razumio sam lekciju.
wake|woke|woken|probuditi se|vejk|vouk|vouken|I {woke} up at seven.|Probudio sam se u sedam.
wear|wore|worn|nositi (odjeću)|ver|vor||She {wore} a blue dress.|Nosila je plavu haljinu.
weep|wept|wept|jecati, plakati|vip|||The baby {wept} all night.|Beba je plakala cijelu noć.
win|won|won|pobijediti||van|van|We {won} the game!|Pobijedili smo u igri!
write|wrote|written|pisati|vrajt|vrout|vriten|I {wrote} a letter to my friend.|Napisao sam pismo prijatelju.`;
const VERBS=RAW.trim().split("\n").map((l,i)=>{const[b,p,pp,hr,x1,x2,x3,s,shr]=l.split("|");return{i,b,p,pp,hr,pr:[x1,x2,x3],s,shr}});
// grupe po 10 (zadnje dvije po 10–11)
const GROUPS=[];(()=>{const n=Math.ceil(VERBS.length/10);let k=0;for(let g=0;g<n;g++){const size=Math.round((VERBS.length-k)/(n-g));GROUPS.push(VERBS.slice(k,k+size));k+=size}})();
const FINAL=GROUPS.length; // indeks završnog testa
const gname=g=>g===FINAL?"Veliki završni test":`Grupa ${g+1}: ${GROUPS[g][0].b} – ${GROUPS[g][GROUPS[g].length-1].b}`;

/* ================= pomoćne ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const alts=f=>f.split("/").map(x=>x.trim().toLowerCase());
const plain=s=>s.replace(/[{}]/g,"");
const marked=s=>esc(s).replace(/\{(.+?)\}/,"<mark>$1</mark>");
const fakeEd=b=>b.endsWith("e")?b+"d":b+"ed";

/* ================= GOVOR ================= */
const TTS="speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
const ICON_SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
const ICON_STOP=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>`;
let vEN=null,vHR=null,activeBtn=null;
function pickVoices(){ if(!TTS)return; const vs=speechSynthesis.getVoices();
 vEN=vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
 vHR=vs.find(v=>/^(hr|bs|sr)/i.test(v.lang))||null; }
if(TTS){pickVoices(); try{speechSynthesis.onvoiceschanged=pickVoices}catch(e){}}
function stopSpeak(){ if(TTS)speechSynthesis.cancel(); if(activeBtn){activeBtn.classList.remove("on");activeBtn.innerHTML=ICON_SPK} activeBtn=null; }
// parts: [[tekst,"en"|"hr"],...]
function say(parts,btn,rate){
 if(!TTS){showHelp();return}
 const was=btn&&btn===activeBtn; stopSpeak(); if(was)return;
 if(!vEN)pickVoices();
 if(btn){activeBtn=btn;btn.classList.add("on");btn.innerHTML=ICON_STOP}
 parts.forEach(([t,l],k)=>{const u=new SpeechSynthesisUtterance(t); const v=l==="hr"?vHR:vEN;
  u.lang=v?v.lang:(l==="hr"?"hr-HR":"en-GB"); if(v)u.voice=v; u.rate=rate||(l==="en"?.8:.9);
  if(k===parts.length-1){u.onend=u.onerror=()=>{if(activeBtn===btn)stopSpeak()}} speechSynthesis.speak(u)});
}
const spk=(id,sm,label="Poslušaj")=>`<button class="spk${sm?" sm":""}" id="${id}" aria-label="${label}" title="${label}">${ICON_SPK}</button>`;
function showHelp(){
 let h=document.getElementById("help");
 if(!h){h=document.createElement("div");h.id="help";h.className="help";h.setAttribute("role","dialog");document.body.appendChild(h)}
 h.innerHTML=`<strong>Izgovor ovdje ne radi</strong><p>Aplikacija Claude otvara stranicu u pregledniku koji ne zna čitati naglas. Otvori stranicu u <b>Chromeu</b> ili <b>Safariju</b>: kopiraj poveznicu i zalijepi je u preglednik.</p><button class="btn" id="helpOk">U redu</button>`;
 h.hidden=false; document.getElementById("helpOk").onclick=()=>{h.hidden=true};
}
// izgovor oblika: "burnt/burned" → "burnt, or burned"
const sayForm=f=>alts(f).join(", or ");

/* ================= ZVUK ================= */
let actx=null, soundOn=true;
try{soundOn=localStorage.getItem("en-zvuk")!=="0"}catch(e){}
function ac(){ if(!soundOn)return null; try{ if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); return actx}catch(e){return null} }
function tone(freqs,step=.09,len=.3,vol=.15){const c=ac(); if(!c)return; const t=c.currentTime;
 freqs.forEach((f,k)=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;const s=t+k*step;
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+len);o.connect(g).connect(c.destination);o.start(s);o.stop(s+len+.02)})}
const ding=()=>tone([660,880]);
const bonk=()=>tone([220,165],.12,.25,.12);
const fanfare=()=>tone([523,659,784,1047],.13,.45,.15);

/* ================= STANJE ================= */
let book={}; try{book=JSON.parse(localStorage.getItem("en-imenik")||"{}")}catch(e){book={}}
const saveBook=()=>{try{localStorage.setItem("en-imenik",JSON.stringify(book))}catch(e){}};
const app=document.getElementById("app");
let P=null;
const gradeOf=pct=>pct>=.9?5:pct>=.75?4:pct>=.6?3:2;
const GNAME={5:"odličan",4:"vrlo dobar",3:"dobar",2:"dovoljan"};
const grHTML=(g,cls="")=>`<span class="gr g${g} ${cls}" title="${GNAME[g]}">${g}</span>`;
function avg(){const all=Object.values(book).flat();return all.length?(all.reduce((a,b)=>a+b,0)/all.length):null}

/* ================= POČETNA ================= */
function home(){
 stopSpeak(); P=null;
 const a=avg(), fives=Object.values(book).flat().filter(x=>x===5).length;
 const rows=[...GROUPS.keys(),FINAL].map(g=>{const list=book[g]||[];
  return `<div class="irow"><span class="nm">${esc(gname(g))}</span><span class="grades">${list.length?list.slice(-6).map(x=>grHTML(x)).join(""):`<span class="gr empty">–</span>`}</span></div>`}).join("");
 app.innerHTML=`<header><h1>Irregular Verbs</h1><p class="sub">Engleski · nepravilni glagoli. Uči glagole, vježbaj i skupljaj ocjene u imenik!</p></header>
 <section class="imenik" aria-label="Moj imenik">
  <div class="head"><h2>Moj imenik</h2><span class="avg">${a?`Prosjek: ${a.toFixed(2).replace(".",",")}`:"Još nema ocjena"}${fives?` · petica: ${fives}`:""}</span></div>
  ${rows}
 </section>
 <button class="toggle" id="snd" aria-pressed="${soundOn}"><span class="sw"></span><span><strong>Zvukovi</strong><br><span class="sub" style="font-size:.9rem">Kratki „ding“ za točan odgovor.</span></span></button>
 <div class="groups">${GROUPS.map((G,g)=>`<div class="grp"><span class="txt"><span class="t">Grupa ${g+1}</span><span class="d">${G.map(v=>v.b).join(", ")}</span></span><span class="row"><button class="btn small ghost" data-learn="${g}">Uči</button><button class="btn small" data-test="${g}">Vježbaj</button></span></div>`).join("")}
  <div class="grp final"><span class="txt"><span class="t">Veliki završni test</span><span class="d">15 nasumičnih glagola iz svih grupa</span></span><button class="btn small" data-test="${FINAL}">Kreni</button></div>
 </div>
 <p class="foot">Savjet: prvo „Uči“ (s izgovorom), pa „Vježbaj“. ${Object.keys(book).length?`<button class="linkbtn" id="reset">Obriši imenik</button>`:""}</p>`;
 app.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>learn(+b.dataset.learn,0));
 app.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>startTest(+b.dataset.test));
 const sn=document.getElementById("snd"); sn.onclick=()=>{soundOn=!soundOn;sn.setAttribute("aria-pressed",soundOn);try{localStorage.setItem("en-zvuk",soundOn?"1":"0")}catch(e){} if(soundOn)ding()};
 const r=document.getElementById("reset"); if(r)r.onclick=()=>{ if(r.dataset.sure){book={};saveBook();home()} else {r.dataset.sure=1;r.textContent="Sigurno? Dodirni opet za brisanje"} };
 scrollTo(0,0);
}

/* ================= UČENJE (kartice) ================= */
function learn(g,k){
 stopSpeak();
 const G=GROUPS[g], v=G[k], labs=["infinitive","past simple","past participle"], fs=[v.b,v.p,v.pp];
 app.innerHTML=`<div class="top"><button class="btn ghost" id="back" aria-label="Natrag na početnu">✕</button><span class="counter">Grupa ${g+1} · ${k+1} / ${G.length}</span></div>
 <div class="card verbcard">
  <div class="vhead"><span class="vbase">${esc(v.b)}</span>${spk("sAll",false,"Poslušaj sva tri oblika")}</div>
  <div class="forms">${fs.map((f,j)=>`<div class="form"><span class="lab">${labs[j]}</span><span class="w">${esc(f)}</span>${v.pr[j]?`<span class="pr">(${esc(v.pr[j])})</span>`:""}${spk("sF"+j,true,"Poslušaj: "+f)}</div>`).join("")}</div>
  <button class="reveal" id="rTr" aria-expanded="false">👁 Dodirni za prijevod</button>
  <div class="sent"><div class="en"><span>${marked(v.s)}</span>${spk("sS",true,"Poslušaj rečenicu")}</div>
   <button class="reveal" id="rSt" aria-expanded="false">👁 Dodirni za prijevod rečenice</button></div>
  <div class="dots" aria-hidden="true">${G.map((_,j)=>`<span class="dot ${j===k?"on":""}"></span>`).join("")}</div>
  <div class="nav"><button class="btn ghost" id="prev" ${k===0?"disabled":""}>◀ Prethodni</button>${k<G.length-1?`<button class="btn" id="next">Sljedeći ▶</button>`:`<button class="btn" id="go">Vježbaj ovu grupu ▶</button>`}</div>
 </div>`;
 document.getElementById("back").onclick=home;
 const sAll=document.getElementById("sAll"); sAll.onclick=()=>say([[`${v.b}. ${sayForm(v.p)}. ${sayForm(v.pp)}.`,"en"]],sAll,.75);
 fs.forEach((f,j)=>{const b=document.getElementById("sF"+j); b.onclick=()=>say([[sayForm(f),"en"]],b,.75)});
 const sS=document.getElementById("sS"); sS.onclick=()=>say([[plain(v.s),"en"]],sS);
 const rv=(id,txt)=>{const b=document.getElementById(id); b.onclick=()=>{b.classList.add("open");b.textContent=txt;b.setAttribute("aria-expanded","true")}};
 rv("rTr","🇭🇷 "+v.hr); rv("rSt","🇭🇷 "+v.shr);
 document.getElementById("prev").onclick=()=>learn(g,k-1);
 const n=document.getElementById("next"); if(n)n.onclick=()=>learn(g,k+1);
 const go=document.getElementById("go"); if(go)go.onclick=()=>startTest(g);
 scrollTo(0,0);
}

/* ================= VJEŽBA ================= */
function makeQ(v,pool){
 const type=pick(["p2","p3","tr","type","fill","rev","p2","fill"]);
 const others=shuffle(pool.filter(x=>x!==v&&x.hr!==v.hr&&x.b!==v.b));
 const opts3=(correct,cands)=>{const bad=new Set(alts(correct)); const out=[];
  for(const c of cands){if(!c)continue; const l=c.toLowerCase(); if(!alts(c).some(x=>bad.has(x))&&!out.some(o=>o.toLowerCase()===l)&&c)out.push(c); if(out.length===2)break}
  return shuffle([correct,...out])};
 switch(type){
  case"p2":{const o=opts3(v.p,[fakeEd(v.b),v.pp,v.b,...others.map(x=>x.p)]);return{t:"mc",v,html:`Koji je <b>past simple</b> od <span class="en">${esc(v.b)}</span>?`,say:[[v.b,"en"]],o,a:o.indexOf(v.p),ans:v.p}}
  case"p3":{const o=opts3(v.pp,[v.p,fakeEd(v.b),v.b,...others.map(x=>x.pp)]);return{t:"mc",v,html:`Koji je <b>past participle</b> od <span class="en">${esc(v.b)}</span>?`,say:[[v.b,"en"]],o,a:o.indexOf(v.pp),ans:v.pp}}
  case"tr":{const o=shuffle([v.hr,...others.slice(0,2).map(x=>x.hr)]);return{t:"mc",v,html:`Što znači <span class="en">${esc(v.b)}</span>?`,say:[[v.b,"en"]],o,a:o.indexOf(v.hr),ans:v.hr}}
  case"rev":{const o=shuffle([v.b,...others.slice(0,2).map(x=>x.b)]);return{t:"mc",v,html:`Kako se na engleskom kaže „${esc(v.hr)}“?`,say:[["Kako se na engleskom kaže "+v.hr,"hr"]],o,a:o.indexOf(v.b),ans:v.b}}
  case"fill":{const used=(v.s.match(/\{(.+?)\}/)||[])[1]; const o=opts3(used,[v.b,v.pp===used?fakeEd(v.b):v.pp,fakeEd(v.b),...others.map(x=>x.p)]);
   return{t:"mc",v,html:`Dopuni rečenicu (<span class="en">${esc(v.b)}</span>):<br>${esc(v.s).replace(/\{.+?\}/,"_____")}`,say:[[v.s.replace(/\{.+?\}/,"...").replace(/[{}]/g,""),"en"]],o,a:o.indexOf(used),ans:used}}
  default:return{t:"type",v,html:`Upiši <b>past simple</b> od <span class="en">${esc(v.b)}</span>.`,say:[[v.b,"en"]],ans:v.p}
 }
}
function startTest(g){
 const verbs=g===FINAL?shuffle(VERBS).slice(0,15):shuffle(GROUPS[g]);
 const pool=g===FINAL?VERBS:GROUPS[g];
 P={g,queue:verbs.map(v=>({q:makeQ(v,pool),first:true})),total:verbs.length,done:0,firstRight:0};
 ask();
}
function ask(){
 if(!P.queue.length)return finish();
 stopSpeak();
 const it=P.queue[0], q=it.q; it.tries=0;
 let body="";
 if(q.t==="mc") body=`<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
 else body=`<div class="row"><input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Odgovor" placeholder="upiši ovdje"><button class="btn" id="chk">Provjeri</button></div><div class="msg" id="msg"></div>`;
 app.innerHTML=`<div class="top"><button class="btn ghost" id="back" aria-label="Natrag na početnu">✕</button><span class="counter">${Math.min(P.done+1,P.total)} / ${P.total} · ${esc(gname(P.g))}</span></div>
 <div class="progress" aria-hidden="true"><span style="width:${P.done/P.total*100}%"></span></div>
 <div class="card"><div class="qhead"><p class="qtext">${q.html}</p>${spk("sQ",false)}</div>${body}<div id="fb"></div></div>`;
 document.getElementById("back").onclick=home;
 const sQ=document.getElementById("sQ"); sQ.onclick=()=>say(q.say,sQ);
 if(q.t==="mc"){
  const bs=[...app.querySelectorAll(".opt")];
  bs.forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a; bs.forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("right")}); if(!ok)b.classList.add("wrong"); result(ok)});
 } else {
  const inp=document.getElementById("inp"), chk=document.getElementById("chk"), msg=document.getElementById("msg");
  inp.focus({preventScroll:true});
  const go=()=>{const val=inp.value.trim().toLowerCase(); if(!val)return;
   if(alts(q.ans).includes(val)){inp.disabled=true;inp.classList.add("ok");chk.remove();msg.textContent="";result(true);return}
   it.tries++; bonk(); inp.classList.add("no");
   if(it.tries<2){msg.textContent=`Nije još točno. Pomoć: počinje slovom „${alts(q.ans)[0][0]}“ i ima ${alts(q.ans)[0].length} slova.`;inp.select();return}
   inp.disabled=true;chk.remove();msg.textContent="";result(false)};
  chk.onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go()};
 }
}
const PRAISE=["Bravo!","Točno!","Super!","Odlično!","Great job!","Well done!"];
function result(ok){
 const it=P.queue.shift(), q=it.q, v=q.v;
 if(ok){P.done++; if(it.first&&!it.tries)P.firstRight++; ding()}
 else {it.first=false; P.queue.push({q:makeQ(v,P.g===FINAL?VERBS:GROUPS[P.g]),first:false}); bonk()}
 const fb=document.getElementById("fb");
 fb.insertAdjacentHTML("afterbegin",`<div class="fb ${ok?"ok":"no"}"><div><b>${ok?PRAISE[Math.random()*PRAISE.length|0]:"Ne baš. Točno je: "+esc(q.ans)}</b>${esc(v.b)} – ${esc(v.p)} – ${esc(v.pp)}${ok?"":`<br><span style="color:var(--muted)">Ovaj glagol vratit će ti se na kraju.</span>`}</div>${spk("sF",true,"Poslušaj sva tri oblika")}</div>
  <div class="actions"><button class="btn" id="nx">${P.queue.length?"Dalje →":"Pogledaj ocjenu"}</button></div>`);
 const sF=document.getElementById("sF"); sF.onclick=()=>say([[`${v.b}. ${sayForm(v.p)}. ${sayForm(v.pp)}.`,"en"]],sF,.75);
 const nx=document.getElementById("nx"); nx.focus({preventScroll:true}); nx.scrollIntoView({block:"nearest",behavior:"smooth"}); nx.onclick=ask;
}
function finish(){
 const pct=P.firstRight/P.total, gr=gradeOf(pct);
 (book[P.g]=book[P.g]||[]).push(gr); saveBook();
 const msg={5:"Odlično! Petica ide u imenik!",4:"Vrlo dobro! Još malo do petice.",3:"Dobro! Ponovi grupu i ide bolja ocjena.",2:"Prolaz! Prvo ponovi kartice, pa probaj opet."}[gr];
 app.innerHTML=`<div class="card reward"><p class="counter">${esc(gname(P.g))}</p><h2>Tvoja ocjena</h2>
  ${grHTML(gr,"big")}<h3>${GNAME[gr]}</h3>
  <p class="sub">Iz prve točno: ${P.firstRight} / ${P.total}</p><p>${msg}</p>
  <div class="actions" style="justify-content:center">${gr<5?`<button class="btn" id="again">Pokušaj za bolju ocjenu</button>`:""}${P.g<FINAL&&gr===5&&P.g+1<FINAL?`<button class="btn" id="nextG">Sljedeća grupa</button>`:""}<button class="btn ghost" id="home">Imenik</button></div></div>`;
 const g=P.g;
 document.getElementById("home").onclick=home;
 const ag=document.getElementById("again"); if(ag)ag.onclick=()=>g===FINAL?startTest(g):learn(g,0);
 const ng=document.getElementById("nextG"); if(ng)ng.onclick=()=>learn(g+1,0);
 if(gr>=4){fanfare(); confetti()} else ding();
 scrollTo(0,0);
}
function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cv=document.getElementById("confetti"), x=cv.getContext("2d"); cv.hidden=false; cv.width=innerWidth; cv.height=innerHeight;
 const cols=["#1E8E4E","#2C7BD6","#F2B705","#D9622B","#8A3FD1"];
 const Pp=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,c:cols[Math.random()*5|0],a:Math.random()*6}));
 let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);Pp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-4,-2,8+p.r,5);x.restore()});if(++t<160)requestAnimationFrame(f);else cv.hidden=true})();
}
home();
</script>

</body></html>
