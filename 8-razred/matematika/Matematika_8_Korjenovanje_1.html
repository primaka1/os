<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Korjenovanje – prilagođeno učenje</title><style>
:root{--blue:#174f82;--green:#16744a;--orange:#a75c00;--red:#a9241b;--ink:#17253a;--bg:#f2f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Verdana,sans-serif;line-height:1.7;letter-spacing:.02em}main{max-width:900px;margin:auto;padding:10px}header{background:linear-gradient(135deg,#174f82,#2e78b5);color:#fff;padding:24px;border-radius:18px}h1{margin:0;font-size:clamp(2rem,8vw,3rem);line-height:1.15}h2{color:var(--blue)}button{min-height:50px;border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:#fff;font-size:17px;font-weight:800;cursor:pointer}.green{background:var(--green)}.orange{background:var(--orange)}.gray{background:#64748b}.purple{background:#714095}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{flex:1}.panel{display:none}.panel.active{display:block}.card,.lesson,.info,#score{background:#fff;border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 2px 10px #0001}.lesson{border-left:7px solid #2e78b5}.task{border:3px solid transparent}.task.ok{border-color:var(--green)}.task.bad{border-color:var(--red)}.eyebrow{font-weight:800;color:#5b6e83;text-transform:uppercase;font-size:.82rem}.question{font-size:1.2rem;font-weight:800;margin:7px 0 13px}.math{font-family:Georgia,'Times New Roman',serif;letter-spacing:.03em}.steps{display:grid;gap:9px;margin:12px 0}.step{display:flex;gap:11px;align-items:flex-start;background:#edf6ff;border-radius:12px;padding:12px}.num{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:900}.visual{background:#fff8df;border:2px solid #f2cc65;border-radius:14px;padding:14px;margin:12px 0}.formula{font-size:1.3rem;text-align:center;background:#edf6ff;padding:13px;border-radius:12px}.factor{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.box{border:2px solid #2e78b5;border-radius:12px;padding:10px 13px;background:#fff;font-weight:800}.arrow{font-size:1.6rem;color:#2e78b5}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.colors div{padding:12px;border-radius:10px;font-weight:800}.c1{background:#dcecff}.c2{background:#fff0b8}.c3{background:#dff5e8}.inputrow{display:grid;grid-template-columns:1fr auto auto;gap:8px}input{width:100%;min-width:0;border:2px solid #9eafc1;border-radius:10px;padding:14px;font-size:20px;background:#fff}.taskbuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.feedback{display:none;padding:12px;border-radius:10px;margin-top:10px}.feedback.show{display:block}.feedback.good{background:#e7f7ee;border-left:6px solid var(--green)}.feedback.bad{background:#fff0ef;border-left:6px solid var(--red)}.feedback.hint{background:#fff8df;border-left:6px solid var(--orange)}.nav{display:flex;gap:8px}.nav button{flex:1}.focus-note{background:#eaf4ff;padding:11px;border-radius:10px}.backbar{display:none;position:sticky;bottom:8px;background:#fff;border:3px solid var(--orange);padding:10px;border-radius:12px;z-index:9}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.calc{width:min(390px,100%);background:#fff;padding:15px;border-radius:17px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.keys button[data-k="+"]{background:#d9f2e5;color:#12623f;border:2px solid #16744a}.keys button[data-k="="]{background:#16744a;color:#fff}.keys button{background:#e5eef7;color:#174f82;font-size:21px}.display{font-size:27px;text-align:right;margin-bottom:8px}.calcresult{text-align:right;font-size:20px;font-weight:bold;min-height:32px}.frac{display:inline-grid;grid-template-rows:auto auto;text-align:center;vertical-align:middle;line-height:1.15;margin:0 5px;font-family:Georgia,"Times New Roman",serif}.frac .top{border-bottom:2.5px solid #17253a;padding:2px 8px 4px}.frac .bottom{padding:4px 8px 2px}.frac.big{font-size:1.35rem}.fraction-example{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:1.15rem;margin:12px 0}.times{font-size:1.4rem;font-weight:bold}.fraction-input-note{font-size:.92rem;background:#edf6ff;padding:8px 10px;border-radius:9px;margin-top:8px}@media(max-width:600px){main{padding:7px}.inputrow{grid-template-columns:1fr auto}.inputrow .check{grid-column:1/-1;width:100%}.colors{grid-template-columns:1fr}.tabs button{flex:1 1 45%}.card,.lesson{padding:15px}.question{font-size:1.12rem}}</style></head><body><main>
<header><h1>Korjenovanje</h1><div>Učimo polako, slikovito i korak po korak</div></header>
<nav class="tabs"><button data-tab="lessons" class="active">Lekcije</button><button data-tab="practice">Vođena vježba</button><button data-tab="test">Test</button></nav>
<section id="lessons" class="panel active"><div id="lessonBox"></div><div class="nav"><button id="prev" class="gray">← Prethodna</button><button id="next">Sljedeća →</button></div><div id="backbar" class="backbar"><b>Vratio/la si se iz zadatka.</b><br><button id="backTask" class="orange">Vrati me na moj zadatak</button></div></section>
<section id="practice" class="panel"><div class="info"><h2>Vođena vježba</h2><div class="focus-note">Radi samo jedan zadatak. Ako ne znaš, pritisni <b>Ne znam – pokaži lekciju</b>.</div></div><div id="practiceBox"></div><button id="newPractice">Novi zadatci</button></section>
<section id="test" class="panel"><div class="info"><h2>Test</h2><p>20 zadataka. Znak <b>√</b> dodaje se posebnim gumbom. Svaki zadatak ima vezu na odgovarajuću lekciju.</p></div><div id="score"></div><div id="testBox"></div><button id="submit">Predaj test</button> <button id="newTest" class="gray">Novi test</button></section>
</main>
<div id="modal" class="modal"><div class="calc"><button id="closeCalc" class="gray">Zatvori</button><h2>Kalkulator</h2><input id="display" class="display" inputmode="text"><div id="keys" class="keys"></div><div id="calcResult" class="calcresult"></div><button id="transfer" class="purple" style="width:100%">Prenesi rezultat u odgovor</button></div></div>
<script>
const $=x=>document.getElementById(x),pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let lesson=0,returnTo=null,calcTarget=null;
const L=[
{t:'1. Što znači kvadratni korijen?',body:`<div class="visual"><b>Zamisli kvadrat od 25 jednakih pločica.</b><div class="formula math">5 redaka × 5 stupaca = 25 pločica</div><div class="factor math"><span class="box">površina 25</span><span class="arrow">→</span><span class="box">stranica 5</span></div></div><div class="steps"><div class="step"><span class="num">1</span><span>Pogledaj broj pod korijenom.</span></div><div class="step"><span class="num">2</span><span>Traži broj koji pomnožen sam sa sobom daje taj broj.</span></div><div class="step"><span class="num">3</span><span class="math">√25 = 5 jer 5·5 = 25.</span></div></div>`},
{t:'2. Množenje korijena',body:`<div class="visual"><div class="factor math"><span class="box">2√3</span><span>·</span><span class="box">5√2</span><span class="arrow">→</span><span class="box">(2·5)√(3·2)</span><span class="arrow">→</span><span class="box">10√6</span></div></div><div class="steps"><div class="step"><span class="num">1</span><span>Pomnoži brojeve ispred korijena: 2·5=10.</span></div><div class="step"><span class="num">2</span><span>Pomnoži brojeve pod korijenom: 3·2=6.</span></div><div class="step"><span class="num">3</span><span>Spoji: 10√6.</span></div></div>`},
{t:'3. Slični korijeni',body:`<div class="visual"><div class="formula math"><span style="color:#1769aa">5√3</span> + <span style="color:#1769aa">2√3</span> = <span style="color:#1769aa">7√3</span></div><div class="formula math"><span style="color:#1769aa">2√3</span> + <span style="color:#a75c00">4√7</span> = ne spajamo</div></div><div class="steps"><div class="step"><span class="num">1</span><span>Provjeri jesu li brojevi pod korijenom jednaki.</span></div><div class="step"><span class="num">2</span><span>Ako jesu, računaj samo brojeve ispred korijena.</span></div><div class="step"><span class="num">3</span><span>Korijen prepiši.</span></div></div>`},
{t:'4. Djelomično korjenovanje',body:`<div class="visual"><div class="factor math"><span class="box">√45</span><span class="arrow">→</span><span class="box">√(9·5)</span><span class="arrow">→</span><span class="box">√9·√5</span><span class="arrow">→</span><span class="box">3√5</span></div></div><div class="steps"><div class="step"><span class="num">1</span><span>U broju 45 pronađi najveći potpuni kvadrat: 9.</span></div><div class="step"><span class="num">2</span><span>Rastavi 45 = 9·5.</span></div><div class="step"><span class="num">3</span><span>√9 izlazi kao 3, a √5 ostaje.</span></div></div>`},
{t:'5. Kvadrat zbroja i razlike',body:`<div class="visual"><div class="colors math"><div class="c1">a²<br>prvi na kvadrat</div><div class="c2">±2ab<br>dvostruki umnožak</div><div class="c3">b²<br>drugi na kvadrat</div></div></div><div class="formula math">(a−b)² = a² − 2ab + b²</div><div class="steps"><div class="step"><span class="num">1</span><span>Kvadriraj prvi član.</span></div><div class="step"><span class="num">2</span><span>Izračunaj dvostruki umnožak 2ab i pazi na znak.</span></div><div class="step"><span class="num">3</span><span>Kvadriraj drugi član.</span></div></div>`},
{t:'6. Racionalizacija nazivnika',body:`<div class="visual"><div class="fraction-example math"><span class="frac big"><span class="top">5</span><span class="bottom">√3</span></span><span class="times">·</span><span class="frac big"><span class="top">√3</span><span class="bottom">√3</span></span><span class="arrow">→</span><span class="frac big"><span class="top">5√3</span><span class="bottom">3</span></span></div><div class="fraction-input-note">Čitaj odozgo prema dolje: <b>brojnik</b>, razlomačka crta, <b>nazivnik</b>.</div></div><div class="steps"><div class="step"><span class="num">1</span><span>Pomnoži brojnik i nazivnik istim korijenom.</span></div><div class="step"><span class="num">2</span><span>U nazivniku vrijedi √3·√3=3.</span></div><div class="step"><span class="num">3</span><span>Skrati razlomak ako možeš.</span></div></div>`}
];
function showLesson(i){lesson=Math.max(0,Math.min(L.length-1,i));$('lessonBox').innerHTML=`<article class="lesson"><div class="eyebrow">Lekcija ${lesson+1} od ${L.length}</div><h2>${L[lesson].t}</h2>${L[lesson].body}</article>`;$('prev').disabled=lesson===0;$('next').textContent=lesson===L.length-1?'Ponovi od početka':'Sljedeća →'}
function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$(id).classList.add('active');scrollTo(0,0)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('prev').onclick=()=>showLesson(lesson-1);$('next').onclick=()=>showLesson(lesson===L.length-1?0:lesson+1);
function make(type){let q,a,how,li=type; if(type===0){let n=pick([9,16,25,36,49,64,81]);q=`Izračunaj √${n}`;a=String(Math.sqrt(n));how=`Traži broj koji pomnožen sam sa sobom daje ${n}.`}
if(type===1){let x=rnd(2,5),y=rnd(2,5),r=pick([2,3,5,7]);q=`Izračunaj ${x}√${r} · ${y}√${r}`;a=String(x*y*r);how=`Množi ${x}·${y}, a √${r}·√${r}=${r}.`}
if(type===2){let r=pick([2,3,5,7]),x=rnd(2,6),y=rnd(1,4);q=`Sredi ${x}√${r} + ${y}√${r}`;a=`${x+y}√${r}`;how='Korijeni su isti. Zbroji samo koeficijente.'}
if(type===3){let x=pick([[12,2,3],[18,3,2],[28,2,7],[45,3,5],[72,6,2],[75,5,3]]);q=`Djelomično korjenuj √${x[0]}`;a=`${x[1]}√${x[2]}`;how=`Rastavi ${x[0]} na ${x[1]*x[1]}·${x[2]}.`}
if(type===4){let r=pick([2,3,5]),x=rnd(2,4),b=rnd(1,3);q=`Izračunaj (${x}√${r}+${b})²`;a=`${x*x*r+b*b}+${2*x*b}√${r}`;how=`Prvi kvadrat je ${x*x*r}, srednji član ${2*x*b}√${r}, zadnji ${b*b}.`}
if(type===5){let r=pick([2,3,5,7]),x=rnd(2,5);q=`Racionaliziraj <span class=\"frac big\"><span class=\"top\">${x}</span><span class=\"bottom\">√${r}</span></span>`;a=`${x}√${r}/${r}`;how=`Pomnoži brojnik i nazivnik s <span class=\"frac\"><span class=\"top\">√${r}</span><span class=\"bottom\">√${r}</span></span>. Konačno dobiješ <span class=\"frac\"><span class=\"top\">${x}√${r}</span><span class=\"bottom\">${r}</span></span>.`}
return{q,a,how,lesson:li,done:false,hints:0}}
function norm(s){return String(s).replace(/\s/g,'').replace(/sqrt\(?([0-9]+)\)?/gi,'√$1').replace(/−/g,'-').replace(/\*/g,'')}
function render(place,num){let data=Array.from({length:num},()=>make(rnd(0,5)));window[place+'Data']=data;$(place).innerHTML=data.map((t,i)=>`<article class="card task" id="${place}c${i}"><div class="eyebrow">${L[t.lesson].t}</div><div class="question math">${i+1}. ${t.q}</div><div class="inputrow"><input id="${place}a${i}" inputmode="decimal" placeholder="Upiši odgovor"><button onclick="root('${place}a${i}')">√</button><button class="purple" onclick="openCalc('${place}a${i}')">CALC</button></div><div class="taskbuttons">${place==='practiceBox'?`<button class="orange" onclick="hint('${place}',${i})">Hint</button>`:''}<button class="gray" onclick="goLesson('${place}',${i})">Ne znam – pokaži lekciju</button><button class="green" onclick="check('${place}',${i})">Provjeri</button></div>${t.lesson===5?`<div class="fraction-input-note">U polje odgovora možeš tehnički upisati <b>${t.a}</b>; prikaz razlomka u zadatku i objašnjenju ostaje u dva reda.</div>`:``}<div class="feedback" id="${place}f${i}"></div></article>`).join('')}
function root(id){let e=$(id),p=e.selectionStart??e.value.length;e.value=e.value.slice(0,p)+'√'+e.value.slice(p);e.focus();e.setSelectionRange(p+1,p+1)}
function hint(place,i){let t=window[place+'Data'][i],f=$(place+'f'+i);t.hints++;f.className='feedback show hint';f.innerHTML=t.hints===1?`<b>Hint 1:</b> ${t.how}`:`<b>Hint 2:</b> Odgovor treba biti zapisan u obliku sličnom: <span class="math">${t.a.replace(/[0-9]/g,'□')}</span>`}
function goLesson(place,i){let t=window[place+'Data'][i];returnTo={tab:place==='practiceBox'?'practice':'test',id:place+'c'+i};showLesson(t.lesson);tab('lessons');$('backbar').style.display='block'}$('backTask').onclick=()=>{if(!returnTo)return;tab(returnTo.tab);setTimeout(()=>$(returnTo.id).scrollIntoView({behavior:'smooth',block:'center'}),100);$('backbar').style.display='none'}
function check(place,i){let t=window[place+'Data'][i],f=$(place+'f'+i),c=$(place+'c'+i);if(norm($(place+'a'+i).value)===norm(t.a)){t.done=true;c.className='card task ok';f.className='feedback show good';f.innerHTML=`<b>Točno!</b><br>${t.how}<br><span class="math">Rezultat: ${t.a}</span>`}else{c.className='card task bad';f.className='feedback show bad';f.innerHTML='<b>Nije još točno.</b> Pokušaj Hint ili se vrati na povezanu lekciju.'}}
$('newPractice').onclick=()=>render('practiceBox',12);$('newTest').onclick=()=>render('testBox',20);$('submit').onclick=()=>{let d=window.testBoxData,s=d.filter(x=>x.done).length,p=Math.round(s/d.length*100);$('score').style.display='block';$('score').innerHTML=`<h2>Rezultat</h2><b>${s}/${d.length} (${p}%)</b>`;scrollTo(0,0)};
function openCalc(id){calcTarget=$(id);$('display').value='';$('calcResult').textContent='';$('modal').classList.add('open')}$('closeCalc').onclick=()=>$('modal').classList.remove('open');let ks=['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','√','0',',','+','='];$('keys').innerHTML=ks.map(k=>`<button data-k="${k}">${k}</button>`).join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k,d=$('display');if(k==='C'){d.value='';$('calcResult').textContent=''}else if(k==='⌫')d.value=d.value.slice(0,-1);else if(k==='='){try{let x=d.value.replace(/,/g,'.').replace(/√(\d+(?:\.\d+)?)/g,'Math.sqrt($1)').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');let v=Function('return '+x)();$('calcResult').textContent='= '+v}catch{$('calcResult').textContent='Neispravan izraz'}}else d.value+=k});$('transfer').onclick=()=>{let t=$('calcResult').textContent.replace(/^=\s*/, '');if(calcTarget&&t&&!t.includes('Neispravan')){calcTarget.value=t.replace('.',',');$('modal').classList.remove('open')}};
showLesson(0);render('practiceBox',12);render('testBox',20);
</script></body></html>
