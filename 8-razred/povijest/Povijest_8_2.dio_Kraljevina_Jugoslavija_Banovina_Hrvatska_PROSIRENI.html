<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Povijest 8. razred – Kraljevina Jugoslavija i Banovina Hrvatska</title><style>:root{--b:#173f70;--g:#18794e;--r:#b42318;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172033;line-height:1.5}main{max-width:950px;margin:auto;padding:22px}header{background:linear-gradient(135deg,#173f70,#3078b8);color:white;padding:26px;border-radius:16px}h1{margin:0 0 8px}.q{background:white;padding:18px;margin:14px 0;border:2px solid transparent;border-radius:12px;box-shadow:0 2px 8px #0001}.q.good{border-color:var(--g)}.q.wrong{border-color:var(--r)}label{display:block;padding:9px;margin:6px 0;border:1px solid #d6deea;border-radius:8px;cursor:pointer}label:hover{background:#f5f8fc}input{margin-right:8px}.fb{display:none;padding:12px;margin-top:12px;border-radius:8px}.fb.good{display:block;background:#e9f8ef;border-left:5px solid var(--g)}.fb.wrong{display:block;background:#fff0ef;border-left:5px solid var(--r)}#sum{display:none;background:white;border:3px solid var(--b);padding:18px;border-radius:12px;margin:16px 0;position:sticky;top:6px;z-index:3}button{border:0;border-radius:9px;padding:13px 20px;color:white;background:var(--b);font-weight:bold;font-size:16px;cursor:pointer;margin:10px 8px 20px 0}#again{display:none;background:#65758b}.missing{outline:3px solid #e9ad00}@media print{button{display:none!important}#sum{position:static}.q{break-inside:avoid;box-shadow:none}}</style></head><body><main><header><h1>Test iz povijesti za 8. razred</h1><div>Šestosiječanjska diktatura, atentat na kralja Aleksandra, hrvatsko pitanje i Banovina Hrvatska</div><div><strong>36 pitanja</strong></div></header><div id="sum"></div><form id="quiz"></form><button id="send" type="button">Provjeri i predaj test</button><button id="again" type="button">Riješi ponovno</button><script>const Q=[["Kada je uvedena Šestosiječanjska diktatura?", ["6. siječnja 1929.", "6. siječnja 1931.", "9. listopada 1934."], 0, "Kralj Aleksandar I. Karađorđević uveo je diktaturu 6. siječnja 1929."], ["Tko je uveo Šestosiječanjsku diktaturu?", ["Kralj Petar II.", "Vladko Maček", "Kralj Aleksandar I. Karađorđević"], 2, "Diktaturu je uveo kralj Aleksandar I. Karađorđević."], ["Što je kralj učinio nakon uvođenja diktature?", ["Uveo višestranačku demokraciju", "Ukinuo Vidovdanski ustav i raspustio Narodnu skupštinu", "Proglasio Banovinu Hrvatsku"], 1, "Kralj je ukinuo Vidovdanski ustav i raspustio Narodnu skupštinu."], ["Što je bilo zabranjeno za vrijeme diktature?", ["Nacionalna obilježja i stranke s nacionalnim obilježjem u nazivu", "Samo sportska društva", "Svi državni simboli"], 0, "Zabranjeni su nacionalne zastave, grbovi i himne te stranke s nacionalnim obilježjem u nazivu."], ["Kako se država zvala od 1929. godine?", ["Kraljevina SHS", "Republika Jugoslavija", "Kraljevina Jugoslavija"], 2, "Godine 1929. naziv Kraljevina SHS zamijenjen je nazivom Kraljevina Jugoslavija."], ["Na koliko je banovina bila podijeljena Kraljevina Jugoslavija?", ["Dvanaest", "Devet", "Šest"], 1, "Država je bila podijeljena na devet banovina."], ["Što je unitarizam trebao stvoriti?", ["Jednu jugoslavensku naciju", "Samostalne nacionalne države", "Savez s Italijom"], 0, "Unitarizam je potirao nacionalne posebnosti i promicao jednu jugoslavensku naciju."], ["Koja je bila posljedica diktature?", ["Proširenje građanskih sloboda", "Ukidanje policije", "Ograničenje građanskih sloboda i cenzura"], 2, "Diktatura je donijela cenzuru, ograničene slobode i progon političkih protivnika."], ["Što se događalo zbog isticanja nacionalnih simbola?", ["To je bilo obvezno", "Ljudi su zatvarani", "Dodjeljivane su nagrade"], 1, "Isticanje zabranjenih nacionalnih simbola moglo je dovesti do zatvaranja."], ["Koja je bila reakcija na diktaturu?", ["Otpor u cijeloj zemlji i jačanje krajnje ljevice i desnice", "Potpuni nestanak oporbe", "Uvođenje federalizma"], 0, "Otpor diktaturi jačao je, kao i skupine koje su je željele nasilno srušiti."], ["Tko je ubijen 1931. godine?", ["Vladko Maček", "Petar II.", "Milan Šufflay"], 2, "Milan Šufflay, hrvatski povjesničar, znanstvenik i političar, ubijen je 1931."], ["Kakav je otpor diktaturi zagovarao HSS?", ["Nije pružao otpor", "Politički, a ne oružani otpor", "Isključivo oružani otpor"], 1, "HSS je zagovarao politički, a ne oružani način borbe protiv diktature."], ["Tko je 1930. u Italiji osnovao Ustašu, hrvatsku revolucionarnu organizaciju?", ["Ante Pavelić", "Ivan Šubašić", "Dragiša Cvetković"], 0, "Ante Pavelić, član Stranke prava, osnovao je organizaciju u Italiji 1930."], ["Koji je bio cilj Ustaša?", ["Očuvanje centralističke Jugoslavije", "Obnova Austro-Ugarske", "Raspad Kraljevine Jugoslavije i stvaranje samostalne hrvatske države"], 2, "Cilj im je bio raspad Jugoslavije i stvaranje hrvatske države koja bi obuhvatila i BiH."], ["Gdje su Ustaše imale logore za obuku?", ["U Hrvatskoj i Sloveniji", "U Italiji i Mađarskoj", "U Francuskoj i Belgiji"], 1, "Prema gradivu, logori za obuku bili su u Italiji i Mađarskoj."], ["Što se dogodilo u Zagrebu 1933.?", ["Neuspjeli atentat na kralja", "Stvorena je Banovina Hrvatska", "Ubijen je Milan Šufflay"], 0, "U Zagrebu je 1933. izveden neuspjeli atentat na kralja."], ["Kada i gdje je ubijen kralj Aleksandar I.?", ["1931. u Zagrebu", "1939. u Beogradu", "1934. u Marseilleu u Francuskoj"], 2, "Kralj Aleksandar I. ubijen je 1934. u Marseilleu u Francuskoj."], ["Tko je izvršio atentat na kralja Aleksandra I.?", ["Ante Pavelić", "Veličko Kerin, član VMRO-a", "Eugen Dido Kvaternik"], 1, "Atentator je bio Veličko Kerin, član VMRO-a."], ["Tko je prema bilješci organizirao atentat na kralja?", ["Eugen Dido Kvaternik, suradnik Ante Pavelića", "Vladko Maček", "Ivan Šubašić"], 0, "Eugen Dido Kvaternik, Pavelićev suradnik, sudjelovao je u organizaciji atentata."], ["Što su zajednički željeli Ustaše i VMRO?", ["Jačanje kraljeve vlasti", "Stvaranje jedne jugoslavenske nacije", "Raspad Kraljevine Jugoslavije"], 2, "Obje organizacije željele su raspad Kraljevine Jugoslavije."], ["Tko je nakon Aleksandrove smrti trebao naslijediti prijestolje?", ["Vladko Maček", "Njegov maloljetni sin Petar II.", "Knez Pavle"], 1, "Aleksandrov sin Petar II. bio je maloljetan."], ["Tko je preuzeo vlast dok je Petar II. bio maloljetan?", ["Tročlano namjesništvo na čelu s knezom Pavlom", "Vladko Maček samostalno", "Narodna skupština"], 0, "Vlast je preuzelo tročlano namjesništvo predvođeno knezom Pavlom Karađorđevićem."], ["Što se podrazumijevalo pod hrvatskim pitanjem?", ["Pitanje hrvatske valute", "Spor Hrvatske i Francuske", "Neravnopravan položaj Hrvatske u Kraljevini Jugoslaviji"], 2, "Hrvatsko pitanje odnosilo se na neravnopravan politički i nacionalni položaj Hrvatske."], ["Što je ubrzalo rješavanje hrvatskog pitanja?", ["Osnivanje Europske unije", "Približavanje Drugoga svjetskog rata", "Završetak Prvoga svjetskog rata"], 1, "Približavanje novoga rata pojačalo je potrebu za unutarnjim političkim dogovorom."], ["Kada je sklopljen Sporazum Cvetković-Maček?", ["26. kolovoza 1939.", "6. siječnja 1929.", "9. listopada 1934."], 0, "Sporazum Dragiše Cvetkovića i Vladka Mačeka sklopljen je 26. kolovoza 1939."], ["Što je stvoreno Sporazumom Cvetković-Maček?", ["Nezavisna Država Hrvatska", "Kraljevina SHS", "Banovina Hrvatska"], 2, "Sporazumom je stvorena Banovina Hrvatska kao autonomna jedinica."], ["Kakav je bio položaj Banovine Hrvatske?", ["Bila je talijanska pokrajina", "Imala je široku autonomiju unutar Kraljevine Jugoslavije", "Bila je potpuno neovisna država"], 1, "Banovina Hrvatska ostala je unutar Kraljevine Jugoslavije, ali je dobila široke autonomne ovlasti."], ["Tko su bili predsjednik i potpredsjednik nove vlade?", ["Dragiša Cvetković predsjednik, Vladko Maček potpredsjednik", "Vladko Maček predsjednik, Ivan Šubašić potpredsjednik", "Knez Pavle predsjednik, Petar II. potpredsjednik"], 0, "Nakon sporazuma predsjednik vlade bio je Dragiša Cvetković, a potpredsjednik Vladko Maček."], ["Tko je bio prvi ban Banovine Hrvatske?", ["Vladko Maček", "Ante Pavelić", "Ivan Šubašić"], 2, "Prvi ban Banovine Hrvatske bio je Ivan Šubašić, član HSS-a."], ["Kojoj je stranci pripadao ban Ivan Šubašić?", ["Narodnoj radikalnoj stranci", "Hrvatskoj seljačkoj stranci (HSS)", "Komunističkoj partiji Jugoslavije"], 1, "Ivan Šubašić bio je član Hrvatske seljačke stranke."], ["Koje su banovine bile sjedinjene u Banovinu Hrvatsku?", ["Savska i Primorska banovina", "Dravska i Dunavska banovina", "Vardarska i Zetska banovina"], 0, "Temelj Banovine Hrvatske činile su Savska i Primorska banovina."], ["Koji su dodatni kotarevi ušli u Banovinu Hrvatsku?", ["Split, Zagreb, Osijek i Varaždin", "Ljubljana, Skoplje i Niš", "Dubrovnik, Ilok, Šid, Brčko, Gradačac, Derventa, Travnik i Fojnica"], 2, "Uz Savsku i Primorsku banovinu uključeni su kotarevi Dubrovnik, Ilok, Šid, Brčko, Gradačac, Derventa, Travnik i Fojnica."], ["Koji su poslovi bili među ovlastima Banovine Hrvatske?", ["Izdavanje vlastite valute i međunarodni ugovori", "Poljoprivreda, trgovina, industrija, prosvjeta, zdravstvo, pravda i unutarnja uprava", "Vanjska politika i vojska"], 1, "Banovina je dobila široke unutarnje ovlasti, dok su vanjska politika i vojska ostale državne."], ["Zašto je Banovina Hrvatska prestala postojati?", ["Zbog napada sila Osovine i raspada Kraljevine Jugoslavije 1941.", "Zbog smrti Vladka Mačeka", "Zbog ukidanja Sporazuma 1939."], 0, "Banovina je prestala djelovati nakon napada na Jugoslaviju i njezina raspada u travnju 1941."], ["Koji primjer najbolje pokazuje neravnopravan položaj Hrvatske prije sporazuma?", ["Hrvatska je imala vlastitu vanjsku politiku", "Hrvatska je bila potpuno samostalna", "Centralizam, ukidanje hrvatske posebnosti i zabrana nacionalnih obilježja"], 2, "Centralističko uređenje, politički progoni i potiranje nacionalnih posebnosti primjeri su neravnopravnosti."], ["Kakav je uglavnom bio položaj ostalih nesrpskih naroda?", ["Nisu živjeli u Kraljevini Jugoslaviji", "Također neravnopravan u centralističkoj državi", "Imali su potpunu samostalnost"], 1, "Centralizam i unitarizam nisu pogađali samo Hrvate, nego i druge nesrpske narode."]],quiz=document.getElementById('quiz');Q.forEach((x,i)=>{let d=document.createElement('section');d.className='q';d.id='q'+i;d.innerHTML=`<strong>${i+1}. ${x[0]}</strong>`+x[1].map((o,j)=>`<label><input type="radio" name="a${i}" value="${j}">${o}</label>`).join('')+`<div class="fb" id="f${i}"></div>`;quiz.appendChild(d)});send.onclick=()=>{let s=0,n=0;Q.forEach((x,i)=>{let d=document.getElementById('q'+i),f=document.getElementById('f'+i),a=document.querySelector('input[name=a'+i+']:checked');d.className='q';if(a&&+a.value===x[2]){s++;d.classList.add('good');f.className='fb good';f.innerHTML='<b>✓ Točno</b><br><b>Točan odgovor:</b> '+x[1][x[2]]+'<br><b>Objašnjenje:</b> '+x[3]}else{d.classList.add('wrong');if(!a){n++;d.classList.add('missing')}f.className='fb wrong';f.innerHTML='<b>✗ '+(a?'Netočno':'Nije odgovoreno')+'</b>'+(a?'<br><b>Tvoj odgovor:</b> '+x[1][+a.value]:'')+'<br><b>Točan odgovor:</b> '+x[1][x[2]]+'<br><b>Objašnjenje:</b> '+x[3]}d.querySelectorAll('input').forEach(z=>z.disabled=true)});let p=Math.round(s/Q.length*100),o=p>=90?'Odličan (5)':p>=75?'Vrlo dobar (4)':p>=60?'Dobar (3)':p>=50?'Dovoljan (2)':'Nedovoljan (1)';sum.style.display='block';sum.innerHTML=`<b>Rezultat: ${s}/${Q.length} (${p}%)</b><br>Ocjena: <b>${o}</b>${n?'<br>Neodgovorena pitanja: '+n:''}<br><small>Ispod svakog pitanja prikazani su učenikov odgovor, točan odgovor i objašnjenje.</small>`;send.style.display='none';again.style.display='inline-block';scrollTo({top:0,behavior:'smooth'})};again.onclick=()=>{quiz.reset();document.querySelectorAll('.q').forEach(d=>{d.className='q';d.querySelectorAll('input').forEach(z=>z.disabled=false)});document.querySelectorAll('.fb').forEach(f=>{f.className='fb';f.innerHTML=''});sum.style.display='none';send.style.display='inline-block';again.style.display='none';scrollTo(0,0)};</script></main></body></html>
