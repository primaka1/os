<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maseni udio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: jedna kartica u sredini, jedan zadatak odjednom, korak po korak; traka napretka; kolekcija osvojenih noktiju */
:root{
  --bg:#EEF2F5; --card:#FFFFFF; --ink:#1C2630; --muted:#5C6B78; --line:#D5DDE3; --grid:#E3E9EE;
  --asphalt:#2E3842; --lane:#F2B705; --accent:#1F6FD1; --accent-ink:#FFFFFF;
  --good:#1E8E4E; --good-bg:#E3F5EA; --bad:#C2412D; --bad-bg:#FBE7E3; --chip:#E4EBF1;
  --v1:#E0700F; --v2:#1F6FD1; --vres:#1E8E4E; --vsel:#8A3FD1; --hint-bg:#FFF6D6; --hint-line:#E8B400;
  --c7a:#8EC5F0; --c7b:#24415E; --c7c:#F2B705; --eH:#1F6FD1; --eC:#1C2630; --eO:#C62E22; --eS:#9A6A00; --eNa:#7A3FC4; --eCl:#1E8E4E; --bH:#FFFFFF; --bC:#3A3F47; --bO:#E0453A; --bS:#F2C230; --bNa:#8E5BD6; --bCl:#3DBE5A; --tH:#1C2630; --tC:#FFFFFF; --tO:#FFFFFF; --tS:#1C2630; --tNa:#FFFFFF; --tCl:#FFFFFF;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A20; --card:#1E262E; --ink:#E9EEF2; --muted:#9DABB7; --line:#33404B; --grid:#2A343D;
  --asphalt:#0C1115; --lane:#F2C230; --accent:#5AA2F5; --accent-ink:#0B1520;
  --good:#5BCB8A; --good-bg:#183526; --bad:#F08A76; --bad-bg:#3E1F1A; --chip:#2A343D;
  --v1:#FF9B45; --v2:#5AA2F5; --vres:#5BCB8A; --vsel:#C08AF5; --hint-bg:#3A3215; --hint-line:#E8B400;
  --c7a:#8EC5F0; --c7b:#C7D3DE; --c7c:#F2B705; --eH:#7FB2FF; --eC:#E9EEF2; --eO:#FF8A7A; --eS:#F2C230; --eNa:#C49BFF; --eCl:#6EDB8C; --bC:#6B7480; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A20; --card:#1E262E; --ink:#E9EEF2; --muted:#9DABB7; --line:#33404B; --grid:#2A343D;
  --asphalt:#0C1115; --lane:#F2C230; --accent:#5AA2F5; --accent-ink:#0B1520;
  --good:#5BCB8A; --good-bg:#183526; --bad:#F08A76; --bad-bg:#3E1F1A; --chip:#2A343D;
  --v1:#FF9B45; --v2:#5AA2F5; --vres:#5BCB8A; --vsel:#C08AF5; --hint-bg:#3A3215; --hint-line:#E8B400;
  --c7a:#8EC5F0; --c7b:#C7D3DE; --c7c:#F2B705; --eH:#7FB2FF; --eC:#E9EEF2; --eO:#FF8A7A; --eS:#F2C230; --eNa:#C49BFF; --eCl:#6EDB8C; --bC:#6B7480; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6;letter-spacing:.02em;word-spacing:.08em;font-variant-numeric:tabular-nums}
html.big body{font-size:22px}
.fx{font-weight:800;letter-spacing:.04em}
.artab{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.arc{background:var(--chip);border-radius:12px;padding:8px;text-align:center;display:grid}
.arc .sym{font-size:1.6rem;font-weight:800}.arc .nm{font-size:.8rem;color:var(--muted)}.arc .val{font-weight:700}
.calcfab{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);font-size:1.7rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.calc{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;width:min(300px,calc(100vw - 28px));background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:12px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cdisp{background:var(--chip);border-radius:10px;padding:10px 12px;text-align:right;font-size:1.6rem;font-weight:800;min-height:56px;overflow-x:auto;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ckeys button{min-height:50px;border:0;border-radius:10px;background:var(--chip);font-size:1.3rem;font-weight:700}
.ckeys button.op{background:var(--line)}
.ckeys button.eq{background:var(--accent);color:var(--accent-ink);grid-column:span 2}
.wrap{padding-bottom:90px}
body.calc-open .wrap{padding-bottom:480px}
[hidden]{display:none!important}
.wrap{max-width:660px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
.sub{color:var(--muted);margin:4px 0 0}
sup{font-size:.68em;line-height:0}
b,strong{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:1.05rem;min-height:52px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{min-height:44px;padding:8px 14px;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vec{position:relative;display:inline-block;padding-top:.32em;line-height:1;letter-spacing:.02em}
.vec::before{content:"";position:absolute;left:1px;right:2px;top:.12em;border-top:2px solid currentColor}
.vec::after{content:"";position:absolute;right:1px;top:-.03em;width:.28em;height:.28em;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg)}

/* izbornik */
.sections{display:grid;gap:12px}
.secrow{display:flex;gap:10px;align-items:center}
.sec{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.sec .num{flex:none;width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
.sec.done .num{background:var(--good-bg);color:var(--good)}
.sec .txt{flex:1;min-width:0}
.sec .t{font-weight:700;display:block}
.sec .d{color:var(--muted);font-size:.9rem}
.sec .mini{flex:none;width:36px}

.garage{background:#4A2545;border-radius:18px;padding:14px 14px 10px;color:#fff}
.garage h3{font-size:1rem;color:#fff;opacity:.9;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px dashed rgba(255,255,255,.25);border-radius:10px;aspect-ratio:1/1;display:grid;place-items:center;max-width:100%}
.slot.full{border-style:solid;border-color:#F8BBD0}
.slot svg{height:88%;width:auto}
.slot .qm{opacity:.35;font-family:var(--display);font-size:1.4rem}

.toggle{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;width:100%;text-align:left}
.toggle .sw{flex:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--good)}
.toggle[aria-pressed="true"] .sw::after{left:25px}
.toggles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

.road{position:relative;height:48px;background:linear-gradient(90deg,#F8BBD0,#B39DDB);border-radius:12px;overflow:hidden}
.road::after{content:none}
.road .carIcon{position:absolute;top:3px;height:42px;width:34px;transition:left .5s ease;z-index:1}
.road .flag{position:absolute;right:8px;top:8px;font-size:1.3rem;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counter{color:var(--muted);font-size:.95rem;margin:0}

/* zadatak */
.qhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qtext{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.35;margin:0 0 14px}
.fig{margin:0 0 14px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.opts{display:grid;gap:10px}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{text-align:left;background:var(--chip);border:2px solid transparent;border-radius:14px;padding:12px 16px;min-height:56px;font-size:1.1rem;width:100%}
.opt.pic{padding:8px;text-align:center}
.opt.pic svg{width:100%;height:auto;max-height:240px;display:block}
.tool .btn.ghost{background:var(--card)}
.opt.pic .lbl{font-weight:700;font-size:.95rem}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--vsel);background:var(--card)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.hint{color:var(--muted);font-size:.95rem;margin:-6px 0 12px}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{font:inherit;font-size:1.5rem;font-weight:700;width:150px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.inp.sm{width:74px}
.inp.ok{border-color:var(--good);background:var(--good-bg)}
.inp.no{border-color:var(--bad);background:var(--bad-bg)}
.unit{font-size:1.25rem;font-weight:700}
.sign{flex:none;width:44px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--chip);font-size:1.5rem;font-weight:700;line-height:1}
.pow{display:inline-flex;align-items:flex-start;gap:4px}
.pow .ten{font-size:1.5rem;font-weight:700;padding-top:14px}
.pow .ex{display:flex;gap:4px;align-items:center;transform:translateY(-6px)}
.dot{font-size:1.5rem;font-weight:700}

.helpbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hints{display:grid;gap:8px;margin-top:10px}
.hintbox{background:var(--hint-bg);border-left:6px solid var(--hint-line);border-radius:10px;padding:10px 14px;font-size:1rem}
.msg{margin-top:10px;font-weight:700;color:var(--bad)}
.steps{display:grid;gap:14px}
.step{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.step.done{border-color:var(--good);background:var(--good-bg)}
.step.failed{border-color:var(--bad)}
.slabel{font-size:1.15rem;font-weight:700}
.step .opts{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.step .opt{text-align:center;font-weight:700;font-size:1.2rem}

.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:1rem}
.fb.ok{background:var(--good-bg);border-left:6px solid var(--good)}
.fb.no{background:var(--bad-bg);border-left:6px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.fbhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}

/* pomagalo s točkom */
.tool{background:var(--chip);border-radius:14px;padding:14px;margin-top:12px;display:grid;gap:10px}
.tool .goal{font-size:.98rem}
.cellsWrap{overflow-x:auto;padding:4px 0 2px}
.cells{--cw:26px;position:relative;display:flex;margin:0 auto;width:max-content;padding:0 4px 18px}
.cell{width:var(--cw);text-align:center;font-size:1.6rem;font-weight:700}
.cell.pad{opacity:.28}
.neg{font-size:1.6rem;font-weight:700;padding-right:4px}
.ptr{position:absolute;bottom:0;width:14px;height:14px;margin-left:-3px;border-radius:50%;background:var(--bad);transition:left .25s ease}
.ptr::before{content:"";position:absolute;left:5px;bottom:14px;width:4px;height:26px;background:var(--bad);opacity:.35;border-radius:2px}
@media (prefers-reduced-motion: reduce){.ptr{transition:none}}
.tool .res{font-size:1.4rem;font-weight:700;text-align:center}
.tool .jumps{text-align:center;color:var(--muted)}
.tool .okline{text-align:center;color:var(--good);font-weight:700}

/* lekcija */
.facts{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.facts li{background:var(--chip);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.facts li span{flex:1;min-width:0}
.facts li strong,.facts li b{color:var(--accent)}
.extra{margin-top:16px;display:grid;gap:10px}
.extra h3{font-size:1.1rem}
.stairs{display:grid;gap:8px}
.stair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:10px 12px;text-align:center}
.stair .u{font-size:1.4rem;font-weight:800}
.stair .arr{font-size:.9rem;line-height:1.3}
.stair .arr .m{color:var(--good);font-weight:700}
.stair .arr .d{color:var(--v1);font-weight:700}
.pbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pcell{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:8px 0;text-align:center;font-weight:700;font-size:.95rem;min-height:44px}
.pcell.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cap{font-size:1.15rem;font-weight:700;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:1rem;min-height:44px}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.emrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--chip);border-radius:12px;padding:8px 12px}
.clips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:40px;padding:6px}
.clip{width:14px;height:34px;border:3px solid var(--muted);border-radius:7px}
.demoTxt{font-size:1.05rem;min-height:3em}

.spk{flex:none;display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--chip);color:var(--accent)}
.spk svg{width:24px;height:24px}
.spk.on{background:var(--accent);color:var(--accent-ink);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.spk.sm{width:38px;height:38px}.spk.sm svg{width:19px;height:19px}
.note{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:.92rem;color:var(--muted)}
.help{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:560px;margin:0 auto;background:var(--card);color:var(--ink);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.help p{margin:6px 0 12px;font-size:.98rem}

.reward{text-align:center}
.bigcar{width:min(170px,60%);margin:6px auto 0;display:block;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.stars{font-family:var(--display);font-size:1.1rem;margin:10px 0 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion: reduce){.bigcar,.spk.on{animation:none}.road .carIcon{transition:none}}
.foot{color:var(--muted);font-size:.85rem;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem;padding:6px}
svg text{font-family:var(--body)}
</style>

<div class="wrap" id="app"></div>
<canvas class="confetti" id="confetti" hidden></canvas>

<script>
/* ================= AUTIĆI ================= */
const CARS=[
 {name:"Ružičasti sa srcima"},{name:"Plavi sa zvjezdicama"},{name:"Francuska manikura"},
 {name:"Duga"},{name:"Točkice"},{name:"Cvjetić"},{name:"Munja"},{name:"Ombre"},{name:"Šljokice"}
];
let nailUid=0;
function carSVG(i){
 const id="nl"+(nailUid++), N="M26 100 L26 42 Q26 14 50 14 Q74 14 74 42 L74 100 Q50 108 26 100 Z";
 const heart=(x,y,r,c)=>`<path d="M${x} ${y+r*.9} C${x-r*1.6} ${y-r*.2} ${x-r*.7} ${y-r*1.3} ${x} ${y-r*.4} C${x+r*.7} ${y-r*1.3} ${x+r*1.6} ${y-r*.2} ${x} ${y+r*.9}Z" fill="${c}"/>`;
 const star=(x,y,r,c)=>{let p="";for(let k=0;k<10;k++){const a=Math.PI/5*k-Math.PI/2,rr=k%2?r*.45:r;p+=`${(x+rr*Math.cos(a)).toFixed(1)},${(y+rr*Math.sin(a)).toFixed(1)} `}return `<polygon points="${p}" fill="${c}"/>`};
 let d="", defs="";
 switch(i){
  case 0:d=`<rect width="100" height="120" fill="#F48FB1"/>${heart(42,40,9,"#fff")}${heart(60,62,7,"#fff")}${heart(40,82,8,"#fff")}`;break;
  case 1:d=`<rect width="100" height="120" fill="#3949AB"/>${star(40,38,9,"#FFD54F")}${star(62,60,7,"#FFD54F")}${star(42,84,8,"#FFD54F")}<circle cx="60" cy="30" r="2" fill="#fff"/><circle cx="34" cy="62" r="2" fill="#fff"/>`;break;
  case 2:d=`<rect width="100" height="120" fill="#FBE3E8"/><path d="M20 38 Q50 50 80 38 L80 0 L20 0Z" fill="#FFFFFF"/><path d="M20 38 Q50 50 80 38" stroke="#E8C7CF" stroke-width="1.5" fill="none"/>`;break;
  case 3:d=["#E53935","#FB8C00","#FDD835","#43A047","#1E88E5","#8E24AA"].map((c,k)=>`<rect y="${10+k*16}" width="100" height="16" fill="${c}"/>`).join("");break;
  case 4:d=`<rect width="100" height="120" fill="#26A69A"/>`+[[38,30],[60,40],[40,56],[62,70],[38,84],[58,94]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#fff"/>`).join("");break;
  case 5:d=`<rect width="100" height="120" fill="#FFF59D"/>`+[0,72,144,216,288].map(a=>`<ellipse cx="50" cy="48" rx="7" ry="12" fill="#F06292" transform="rotate(${a} 50 60)"/>`).join("")+`<circle cx="50" cy="60" r="6" fill="#FFB300"/><path d="M50 72 Q46 88 52 100" stroke="#43A047" stroke-width="3" fill="none"/>`;break;
  case 6:d=`<rect width="100" height="120" fill="#212121"/><polygon points="56,18 34,62 48,62 40,100 68,50 53,50 62,18" fill="#FFD600"/>`;break;
  case 7:defs=`<linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E57C2"/><stop offset="1" stop-color="#F8BBD0"/></linearGradient>`;d=`<rect width="100" height="120" fill="url(#${id}g)"/>`;break;
  case 8:d=`<rect width="100" height="120" fill="#B39DDB"/>`+Array.from({length:26},(_,k)=>`<circle cx="${28+(k*37)%46}" cy="${18+(k*23)%84}" r="${1.5+(k%3)}" fill="${k%2?"#FFD54F":"#FFFFFF"}"/>`).join("");break;

function fmt(s){
 return String(s)
  .replace(/\[([A-Z]'?[A-Z]'?)\]/g,'<span class="vec">$1</span>')
  .replace(/10\^\(?(-?\d+)\)?/g,(m,e)=>`10<sup>${e.replace("-","−")}</sup>`)
  .replace(/(^|[\s(=:])-(?=\d)/g,"$1−");
}
function sayText(s){
 return String(s)
  .replace(/<sup>(−|-)?(\d+)<\/sup>/g,(m,a,b)=>" na "+(a?"minus ":"")+b)
  .replace(/\[([A-Z])'?([A-Z])'?\]/g,"vektor $1 $2")
  .replace(/10\^\(?(-?)(\d+)\)?/g,(m,a,b)=>"10 na "+(a?"minus ":"")+b)
  .replace(/<[^>]+>/g," ")
  .replace(/[„“"]/g,"")
  .replace(/(^|[\s(=])[-−](?=\s?\d)/g,"$1minus ")
  .replace(/\s[−-]\s/g," minus ")
  .replace(/(\d)\.(\d)/g,"$1 zarez $2")
  .replace(/·/g," puta ").replace(/\s:\s/g," podijeljeno sa ")
  .replace(/=/g," jednako ").replace(/%/g," posto").replace(/€/g," eura")
  .replace(/→/g,", pa ").replace(/[✅🏁⭐🏆💡🔎✓]/g,"")
  .replace(/\s+/g," ").trim();
}

function calcEval(expr){

 const out=[],ops=[],pr={"+":1,"-":1,"×":2,"÷":2};
 const ap=()=>{const o=ops.pop(),b=out.pop(),a=out.pop();if(a===undefined||b===undefined)throw 0;out.push(o==="+"?a+b:o==="-"?a-b:o==="×"?a*b:a/b)};

  return out.length===1&&isFinite(out[0])?out[0]:null}catch(e){return null}
}

 [660,880].forEach((f,k)=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(0,t+k*.09);g.gain.linearRampToValueAtTime(.15,t+k*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t+k*.09+.3);
  o.connect(g).connect(c.destination);o.start(t+k*.09);o.stop(t+k*.09+.32)}); }

/* ================= POMAGALO S TOČKOM ================= */
function pointTool(el,cfg){
 const [ip,fp=""]=cfg.num.split("."); const digits=ip+fp;
 const L=Math.max(2,cfg.mode==="std"&&cfg.exp<0?-cfg.exp+1:2), R=Math.max(2,cfg.mode==="std"&&cfg.exp>0?cfg.exp-fp.length+1:2);
 const chars=("0".repeat(L)+digits+"0".repeat(R)).split("");
 const start=L+ip.length; let idx=start;
 const trim=()=>{let a=chars.slice(0,idx).join("").replace(/^0+/,"")||"0"; let b=chars.slice(idx).join("").replace(/0+$/,""); return b?a+"."+b:a};
 const neg=cfg.neg?"−":"";
 const goal=cfg.mode==="sci"
  ?`Pomiči crvenu točku dok <b>ispred nje</b> ne ostane <b>samo jedna znamenka</b> (koja nije 0).`
  :`Eksponent je <b>${showNum(cfg.exp)}</b> → točka skače <b>${Math.abs(cfg.exp)} ${cfg.exp>0?"udesno":"ulijevo"}</b>.`;
 function draw(){
  const moved=start-idx, t=trim(), intPart=t.split(".")[0];
  let res,ok;
  if(cfg.mode==="sci"){ ok=intPart.length===1&&intPart!=="0"; res=`${neg}${t} · 10<sup>${showNum(moved)}</sup>`; }
  else { ok=(idx-start)===cfg.exp; res=`${neg}${t}`; }
  el.innerHTML=`<div class="goal">${goal}</div>
   <div class="cellsWrap"><div class="cells">${neg?`<span class="neg">−</span>`:""}<span style="position:relative;display:flex">${chars.map((c,i)=>`<span class="cell ${i<L||i>=L+digits.length?"pad":""}">${c}</span>`).join("")}<span class="ptr" style="left:calc(${idx} * var(--cw))"></span></span></div></div>
   <div class="row" style="justify-content:center"><button class="btn small ghost" data-d="-1">◀ ulijevo</button><button class="btn small ghost" data-d="1">udesno ▶</button><button class="btn small ghost" data-d="0">ispočetka</button></div>
   <div class="jumps">Skokova: <b>${Math.abs(moved)}</b> ${moved>0?"ulijevo":moved<0?"udesno":""}</div>
   <div class="res">${res}</div>
   ${ok?`<div class="okline">✓ Gotovo! ${cfg.mode==="sci"?"Ispred točke je jedna znamenka.":"Točka je skočila koliko treba."}</div>`:""}`;
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const d=+b.dataset.d; if(d===0)idx=start; else idx=Math.max(1,Math.min(chars.length-1,idx+d)); draw(); const nb=el.querySelector(`[data-d="${d}"]`); if(nb)nb.focus()});
 }
 draw();
}

function start(i){

/* ---------- prikaz zadatka ---------- */
function vecPts(o){const m=o.match(/\[([A-Z])([A-Z])\]/);return m?[m[1],m[2]]:null}
function ansHTML(signed,id,cls=""){
 return `${signed?`<button class="sign" data-for="${id}" aria-label="Predznak plus ili minus" title="Promijeni predznak">+</button>`:""}<input class="inp ${cls}" id="${id}" inputmode="decimal" autocomplete="off" aria-label="Odgovor">`;
}
function wireSigns(root){ root.querySelectorAll(".sign").forEach(b=>b.onclick=()=>{b.textContent=b.textContent==="+"?"−":"+";b.setAttribute("aria-pressed",b.textContent==="−")}); }
const isNeg=id=>{const b=app.querySelector(`.sign[data-for="${id}"]`);return b&&b.textContent==="−"};

function questionSay(q){
 let t=q.q+" ";
 if(q.t==="mc"||q.t==="multi")t+="Ponuđeno: "+[...app.querySelectorAll(".opts .opt")].map(b=>b.textContent.trim()+".").join(" ");
 if(q.t==="pic")t+="Ponuđene su tri slike. Odaberi točnu.";
 if(q.t==="steps")t+="Riješi korak po korak. "+q.steps[0].l;
 if(q.t==="sci")t+="Upiši broj i eksponent.";
 return t;
}

function ask(){
 if(window.closeCalc)closeCalc();
 if(!S.queue.length) return reward();
 stopSpeak();
 const item=S.queue[0], q=item.q; item.tries=0; item.failed=false;
 const pct=S.done/S.total;
 let body="";
 const fig=q.fig||(q.ref?{type:"rect",arrows:[[q.ref[0],q.ref[1],"o"]].concat(q.ref2?[[q.ref2[0],q.ref2[1],"b"]]:[])}:null);
 if(q.t==="mc"||q.t==="multi"){
  const order=shuffle(q.o.map((_,k)=>k));
  body=`${q.t==="multi"?`<p class="hint">Dodirni ${q.a.length} odgovora, pa „Provjeri“.</p>`:""}<div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${fmt(q.o[k])}</button>`).join("")}</div>${q.t==="multi"?`<div class="actions"><button class="btn" id="check" disabled>Provjeri</button></div>`:""}`;
 } else if(q.t==="pic"){
  const order=shuffle(q.o.map((_,k)=>k));
  body=`<div class="opts pics">${order.map((k,n)=>`<button class="opt pic" data-k="${k}"><span class="lbl">Slika ${n+1}</span>${q.o[k]}</button>`).join("")}</div>`;
 } else if(q.t==="num"){
  body=`<div class="ans">${ansHTML(q.signed,"in0")}${q.unit?`<span class="unit">${q.unit}</span>`:""}<button class="btn" id="check">Provjeri</button></div><div class="msg" id="msg"></div>`;
 } else if(q.t==="sci"){
  body=`<div class="ans"><input class="inp" id="inM" inputmode="decimal" autocomplete="off" aria-label="Broj ispred puta" style="width:120px"><span class="dot">·</span><span class="pow"><span class="ten">10</span><span class="ex">${ansHTML(true,"inX","sm")}</span></span><button class="btn" id="check">Provjeri</button></div><div class="msg" id="msg"></div>`;
 } else if(q.t==="steps"){
  body=`<div class="steps">${q.steps.map((s,k)=>`<div class="step" id="st${k}" ${k?"hidden":""}><div class="slabel">${fmt(s.l)}</div>
   ${s.o?`<div class="opts">${shuffle(s.o.map((_,j)=>j)).map(j=>`<button class="opt" data-s="${k}" data-k="${j}">${fmt(s.o[j])}</button>`).join("")}</div>`
        :`<div class="ans">${ansHTML(false,"sin"+k)}${s.unit?`<span class="unit">${s.unit}</span>`:""}<button class="btn" data-check="${k}">Provjeri</button></div>`}
   ${s.hint?`<div><button class="btn small ghost" data-sh="${k}">💡 Pomoć</button></div><div class="hintbox" id="sh${k}" hidden>${fmt(s.hint)}</div>`:""}
   <div class="msg" id="sm${k}"></div></div>`).join("")}</div>`;
 }
 const helpbar=(q.hints||q.tool)?`<div class="helpbar">${q.hints?`<button class="btn small ghost" id="hbtn">💡 Pomoć (0/${q.hints.length})</button>`:""}${q.tool?`<button class="btn small ghost" id="tbtn">🔎 Pomagalo s točkom</button>`:""}</div><div class="hints" id="hints"></div>${q.tool?`<div class="tool" id="qtool" hidden></div>`:""}`:"";
 app.innerHTML=`<div class="top"><button class="btn ghost" id="back" aria-label="Natrag na izbornik">✕</button><span class="counter">${Math.min(S.done+1,S.total)} / ${S.total}</span></div>
 <div class="road" aria-hidden="true"><div class="carIcon" style="left:calc(${pct} * (100% - 80px) + 8px)">${carSVG(S.i)}</div><span class="flag">💅</span></div>
 <div class="card"><div class="qhead"><p class="qtext">${fmt(q.q)}</p>${spkBtn("spkQ")}</div>${VOICE_NOTE}
 ${fig?`<div class="fig" id="qfig">${figHTML(fig)}</div>`:""}
 ${body}${helpbar}<div id="fb"></div></div>`;
 document.getElementById("back").onclick=home;
 const sq=document.getElementById("spkQ"); sq.onclick=()=>speak(questionSay(q),sq); if(autoRead&&TTS) speak(questionSay(q),sq);
 wireSigns(app);
 const figEl=document.getElementById("qfig");
 const redraw=extra=>{};

 // pomoć
 let hn=0; const hb=document.getElementById("hbtn");
 const nextHint=()=>{ if(!q.hints||hn>=q.hints.length)return; document.getElementById("hints").insertAdjacentHTML("beforeend",`<div class="hintbox">${fmt(q.hints[hn])}</div>`); hn++; if(hb){hb.textContent=`💡 Pomoć (${hn}/${q.hints.length})`; if(hn>=q.hints.length)hb.disabled=true} };
 if(hb) hb.onclick=nextHint;
 const tb=document.getElementById("tbtn");
 if(tb){const box=document.getElementById("qtool"); let made=false; tb.onclick=()=>{box.hidden=!box.hidden; if(!made){pointTool(box,q.tool);made=true}}}

 if(q.t==="mc"||q.t==="pic"){
  const opts=[...app.querySelectorAll(".opts .opt")];
  opts.forEach(b=>b.onclick=()=>{
   const ok=+b.dataset.k===q.a;
   opts.forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("right")});
   if(!ok)b.classList.add("wrong");
   if(q.res) redraw([[q.res[0],q.res[1],"g"]]);
   else if(fig&&fig.type==="rect"){const v=vecPts(q.o[q.a]); if(v)redraw([[v[0],v[1],"g"]])}
   result(ok,q.t==="pic"?"pogledaj zelenu sliku":q.o[q.a]);
  });
 } else if(q.t==="multi"){
  const sel=new Set(), chk=document.getElementById("check"), opts=[...app.querySelectorAll(".opts .opt")];
  const show=()=>redraw([...sel].map(k=>{const v=vecPts(q.o[k]);return v&&[v[0],v[1],"p"]}));
  opts.forEach(b=>b.onclick=()=>{const k=+b.dataset.k; sel.has(k)?sel.delete(k):sel.add(k); b.classList.toggle("sel"); chk.disabled=sel.size!==q.a.length; show()});
  chk.onclick=()=>{
   const ok=q.a.every(k=>sel.has(k));
   opts.forEach(x=>{x.disabled=true;const k=+x.dataset.k;x.classList.remove("sel");if(q.a.includes(k))x.classList.add("right");else if(sel.has(k))x.classList.add("wrong")});
   redraw(q.a.map(k=>{const v=vecPts(q.o[k]);return v&&[v[0],v[1],"g"]}));
   chk.remove(); result(ok,q.a.map(k=>q.o[k]).join(", "));
  };
 } else if(q.t==="num"||q.t==="sci"){
  const chk=document.getElementById("check"), msg=document.getElementById("msg");
  const inputs=q.t==="num"?["in0"]:["inM","inX"];
  inputs.forEach(id=>{const el=document.getElementById(id); el.onkeydown=e=>{if(e.key==="Enter")go()}});
  document.getElementById(inputs[0]).focus({preventScroll:true});
  const answerText=q.t==="num"?showNum(q.a)+(q.unit?" "+q.unit:""):`${q.m} · 10^${q.x}`;
  function go(){
   let ok, partial="";
   if(q.t==="num"){const v=parseNum(document.getElementById("in0").value,isNeg("in0")); if(v===null)return; ok=same(v,q.a);
    if(!ok&&same(Math.abs(v),Math.abs(q.a))) partial="Broj je dobar, ali provjeri predznak (+ ili −).";}
   else {const m=parseNum(document.getElementById("inM").value), x=parseNum(document.getElementById("inX").value,isNeg("inX")); if(m===null||x===null)return;
    ok=same(m,q.m)&&x===q.x;
    if(!ok&&same(m,q.m)) partial="Broj ispred je točan! Provjeri eksponent: broji skokove i pazi na minus.";
    else if(!ok&&x===q.x) partial="Eksponent je točan! Provjeri broj ispred točke.";
    document.getElementById("inM").classList.toggle("ok",same(m,q.m)); document.getElementById("inX").classList.toggle("ok",x===q.x);}
   if(ok){ inputs.forEach(id=>{const el=document.getElementById(id);el.disabled=true;el.classList.remove("no");el.classList.add("ok")}); chk.remove(); msg.textContent=""; result(true,answerText); return; }
   item.tries++; bump();
   if(item.tries<2){ msg.textContent=(partial||"Nije još točno.")+" Pogledaj pomoć 💡 i pokušaj ponovo."; nextHint(); if(q.tool){const box=document.getElementById("qtool"); if(box.hidden)document.getElementById("tbtn").click()} return; }
   inputs.forEach(id=>{const el=document.getElementById(id);el.disabled=true;if(!el.classList.contains("ok"))el.classList.add("no")}); chk.remove(); msg.textContent="";
   result(false,answerText);
  }
  chk.onclick=go;
 } else if(q.t==="steps"){
  let cur=0;
  const finishStep=(k,good)=>{
   const st=document.getElementById("st"+k); st.classList.add(good?"done":"failed");
   if(!good)item.failed=true;
   if(good)ding();
   if(k+1<q.steps.length){ cur=k+1; const nx=document.getElementById("st"+cur); nx.hidden=false; const inp=document.getElementById("sin"+cur); if(inp)inp.focus({preventScroll:true}); nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    if(autoRead&&TTS) speak(q.steps[cur].l); }
   else { const last=q.steps[q.steps.length-1]; result(!item.failed, showNum(last.a)+(last.unit?" "+last.unit:""), true); }
  };
  app.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>{document.getElementById("sh"+b.dataset.sh).hidden=false;b.remove()});
  app.querySelectorAll(".step .opt").forEach(b=>b.onclick=()=>{
   const k=+b.dataset.s, s=q.steps[k], ok=+b.dataset.k===s.a;
   const sib=[...document.querySelectorAll(`#st${k} .opt`)];
   if(ok){sib.forEach(x=>{x.disabled=true;if(+x.dataset.k===s.a)x.classList.add("right")}); document.getElementById("sm"+k).textContent=""; finishStep(k,true);}
   else{ bump(); b.classList.add("wrong"); b.disabled=true; item.tries++;
    const left=sib.filter(x=>!x.disabled);
    if(left.length===1){left[0].classList.add("right");left[0].disabled=true; finishStep(k,false);}
    else document.getElementById("sm"+k).textContent="Pokušaj ponovo."; }
  });
  app.querySelectorAll("[data-check]").forEach(btn=>{
   const k=+btn.dataset.check, s=q.steps[k], inp=document.getElementById("sin"+k), m=document.getElementById("sm"+k); let tries=0;
   const go=()=>{ const v=parseNum(inp.value); if(v===null)return;
    if(Math.abs(v-s.a)<=(s.tol||1e-9)){inp.disabled=true;inp.classList.remove("no");inp.classList.add("ok");btn.remove();m.textContent="";finishStep(k,true);return}
    tries++; bump(); inp.classList.add("no");
    if(tries<2){ m.textContent="Nije još točno. Pokušaj ponovo."; const hbx=document.getElementById("sh"+k); if(hbx){hbx.hidden=false; const hb2=app.querySelector(`[data-sh="${k}"]`); if(hb2)hb2.remove()} return; }
    inp.value=showNum(s.a); inp.disabled=true; btn.remove(); m.style.color="var(--muted)"; m.textContent="Točan broj je upisan. Pogledaj ga i idemo dalje."; finishStep(k,false);
   };
   btn.onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go()};
  });
  const i0=document.getElementById("sin0"); if(i0)i0.focus({preventScroll:true});
 }
}

const PRAISE=["Bravo!","Točno!","Super!","Odlično!","Tako je!","Pogodak!"];
function result(ok,correct,isSteps){
 const item=S.queue.shift(), q=item.q;
 if(ok){S.done++; if(item.first&&!item.tries)S.firstRight++;}
 else {item.first=false; S.queue.push(item);}
 stopSpeak();
 if(ok) ding(); else bump();
 const fb=document.getElementById("fb");
 const praise=PRAISE[Math.random()*PRAISE.length|0];
 const head=ok?`${praise} ✅`:(isSteps?"Dobro je, idemo dalje.":`Ne baš. Točno je: ${fmt(correct)}`);
 const tail=ok?"":(isSteps?"Ovaj zadatak ponovit ćemo još jednom na kraju.":"Ovaj zadatak vratit će ti se na kraju.");
 const sayIt=`${head}. ${q.e||""} ${tail}`;
 fb.innerHTML=`<div class="fb ${ok?"ok":"no"}"><div class="fbhead"><div><b>${head}</b>${q.e?fmt(q.e):""}${tail?`<br><span style="color:var(--muted)">${tail}</span>`:""}</div>${spkBtn("spkF",true)}</div></div>
 <div class="actions"><button class="btn" id="next">${S.queue.length?"Dalje →":"Do cilja! 💅"}</button></div>`;
 const sf=document.getElementById("spkF"); sf.onclick=()=>speak(sayIt,sf); if(autoRead&&TTS&&!ok) setTimeout(()=>speak(sayIt,sf),350);
 const n=document.getElementById("next"); n.focus({preventScroll:true}); n.scrollIntoView({block:"nearest",behavior:"smooth"});
 n.onclick=ask;
}

 <h2>${first?"Novi nokat u kolekciji!":"Opet do cilja!"}</h2>
 <div class="bigcar">${carSVG(i)}</div>
 <h3 style="margin-top:8px">${CARS[i].name}</h3>

 ${all?`<p><strong>Kolekcija je puna, svih ${N} noktiju! Vrijeme je za ispit. 🏆</strong></p>`:`<p class="sub">Popij vode, protegni se 1 minutu, pa idemo dalje.</p>`}

 document.getElementById("home").onclick=home;

 stopSpeak(); ding(); setTimeout(ding,350); setTimeout(ding,700); confetti(); scrollTo(0,0);
}

function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cv=document.getElementById("confetti"), x=cv.getContext("2d");
 cv.hidden=false; cv.width=innerWidth; cv.height=innerHeight;
 const cols=["#F2B705","#D8432F","#2E9D5B","#2F7BE0","#EE7A1E","#7E4FD1"];
 const P=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,c:cols[Math.random()*6|0],a:Math.random()*6}));
 let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-4,-2,8+p.r,5);x.restore()});if(++t<160)requestAnimationFrame(f);else cv.hidden=true})();
}

home();
</script>
